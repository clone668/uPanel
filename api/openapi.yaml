            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceUnitDetail'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），或本机没有可用的 systemctl。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/processes:
    get:
      operationId: listProcesses
      summary: 主机进程列表（含保护名单与可发送的信号）
      description: |
        CONTRACTS.md 第 10.2 节（P05.2 起），权限 admin。经代理的 processes.list 查询取回
        最近一次采集的快照；Web 不直接读 /proc。

        进程身份是 **pid + start_time_ticks**，不是 pid：内核会重用 PID，而 starttime
        （/proc/<pid>/stat 第 22 字段，开机以来的时钟滴答数）不会。终止进程必须把两者
        一起提交，旧预检因此杀不到被重用的新进程。

        采集失败时**不清空列表**：status 为 error，error 说明原因，processes 仍是上一次
        成功的内容，collected_at 是那次的时间。空列表会被读成“这台机器没有进程”。

        capabilities 只列出当前状态与保护规则下真正能发送的信号（TERM、KILL），
        受保护与已退出（zombie/dead）的进程一律为空数组。写操作必须走 process.signal
        的预检与任务，且 TERM 与 KILL 是两次独立操作，不在本接口提供任何捷径。

        truncated 为 true 表示进程数超过上限（2000）被截断，不是“只有这些”。
      tags: [services]
      responses:
        '200':
          description: 进程列表与采集元数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProcessListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/logs:
    get:
      operationId: queryLogs
      summary: 结构化日志查询（仅 admin）
      description: |
        CONTRACTS.md 第 10 节（P05.3 起），权限 admin。经代理的 logs.query 读取 journald；
        Web 不直接读 /var/log，也不执行任何命令。

        **只有管理员。** 原始日志里可能有口令形态的字符串、内网地址与别人的命令行。
        PLAN.md 第 14 节写明：秘密过滤是**尽力**措施，不能作为向 viewer 开放日志的依据。
        所以 viewer 在这里得到 403，而不是“脱敏后的日志”。

        过滤：source 是闭集 journal|kernel；unit 只在 source=journal 时允许，且必须是完整
        单元名（不接受通配符与路径——journalctl 的 -u 会展开通配符，而“让调用方决定匹配
        模式”正是这里要避免的自由度）；level 是 syslog 级别**下限**（该级别及更严重）。
        level=unknown 不是合法入参：unknown 只出现在**结果**里，表示该条目没有可识别的
        PRIORITY。把读不出来的级别当成 info，会让“只看 error”这类过滤看起来生效了。

        时间：from、to 为 RFC 3339（含端点），必须 from < to，跨度 ≤ 24 小时；都不给时
        回看 1 小时，只给 to 时同样回看 1 小时。to 明显超过当前时间（容差 2 分钟）返回
        400——未来窗口永远为空，与其让人以为“这段时间没有日志”，不如直说参数写错了。

        分页是**降序键集**：结果按时间从新到旧，next_cursor 是本页最后一条的游标，带回来
        即“从这里（含）继续向更早翻”；边界条目被重复返回时客户端按 cursor 去重。游标不
        透明，不要手工构造；被拒绝的游标返回 400，重试同一个游标不会变好。翻到尽头时
        next_cursor 为 null。

        限额由服务端强制，前端传什么都放宽不了：最多 1000 行、单页消息累计 1 MiB、
        单条消息保留 8 KiB。触到上限时 truncated=true，truncated_reason 说明是哪一条限额
        先到——这不是“只有这些日志”。

        message 已经过尽力脱敏；redacted=true 只表示“这条里至少有一处被抹过”，
        不代表“这条是安全的”。
      tags: [logs]
      parameters:
        - $ref: '#/components/parameters/LogSource'
        - $ref: '#/components/parameters/LogUnit'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogFrom'
        - $ref: '#/components/parameters/LogTo'
        - $ref: '#/components/parameters/LogLimit'
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 next_cursor，语义是“从这里（含）向更早翻”。
          schema:
            type: string
            maxLength: 512
            pattern: '^[A-Za-z0-9=;:._+\-/]+$'
      responses:
        '200':
          description: 日志页（按时间从新到旧）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/LogPage'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            参数不合法（VALIDATION_ERROR）：时间格式、时间先后、跨度超过 24 小时、
            to 在未来、level/source 不在闭集内、unit 形状不合法、limit 越界，或游标被拒。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 权限不足（FORBIDDEN）。日志只对 admin 开放，viewer 拿不到“脱敏版”。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 代理不可用（AGENT_UNAVAILABLE）：未配置 socket、连接失败或本机无 journald。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/logs/stream:
    get:
      operationId: streamLogs
      summary: 实时日志流（SSE，仅 admin）
      description: |
        CONTRACTS.md 第 10 节（P05.3 起）。这是 GET，靠会话 Cookie + 同源 Origin 校验，
        不要求 X-CSRF-Token（EventSource 无法自定义请求头）。参数与 GET /logs 相同，
        但 **cursor 语义是“续传”**：`cursor` 或 `Last-Event-ID` 给定时，从该游标**之后**
        开始发送（不含该条本身），缺省则从窗口末尾开始跟随。

        帧格式：`id: <journal 游标>`、`event: entry|end|error`、`data: <JSON>`。
        - `entry`：一条日志，data 与 LogEntry 同形。
        - `end`：本次流正常结束，data 为 `{"reason": "..."}`；reason 是闭集：
          `duration_limit`（到达单条流的最长时长）、`idle_timeout`（窗口内一直没有新条目）、
          `entry_limit`（到达单条流的条数上限）、`byte_limit`（到达字节上限）、
          `journal_exit`（journalctl 自己退出了，不是我们收掉的）、
          `client_closed`（调用方不再接收）。客户端自己断开时不会再收到这一帧——
          连接已经没了；其余情况客户端收到 end 后不应立刻自动重连。
        - `error`：流异常中断，data 为 `{"code":"STREAM_FAILED","message":"..."}`。
        每 15 秒发送一行注释心跳（`: keepalive`），避免中间设备掐掉空闲连接。

        断线重连由浏览器 EventSource 负责：它把最后一个 `id`（journal 游标）作为
        `Last-Event-ID` 带回，服务端从该游标**之后**续发，因此重连既不会重复也不需要
        客户端自己记位置。日志流**没有**任务事件流那样的 `gap` 帧：续传点是 journal
        自己的游标，历史不会被本服务裁剪，游标失效时直接以 400 结束而不是假装续上了。

        **资源回收**：客户端断开、代理返回错误或心跳写入失败时，请求 ctx 结束，代理侧
        对 journalctl 的跟随进程随之被杀掉。STAGES.md 第 7 阶段的验收条款“结束日志订阅
        不会残留无限 journalctl 子进程”验的就是这条链路。

        每个账号同时最多 4 条流（与任务事件流共用额度）；超出返回 429。慢客户端会被写
        超时断开，随后按 Last-Event-ID 重连。
      tags: [logs]
      parameters:
        - $ref: '#/components/parameters/LogSource'
        - $ref: '#/components/parameters/LogUnit'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogFrom'
        - $ref: '#/components/parameters/LogTo'
        - $ref: '#/components/parameters/LogLimit'
        - name: cursor
          in: query
          required: false
          description: 从该游标**之后**开始发送（续传，不含该条本身）。
          schema:
            type: string
            maxLength: 512
            pattern: '^[A-Za-z0-9=;:._+\-/]+$'
        - name: Last-Event-ID
          in: header
          required: false
          description: EventSource 自动带回的最后一个 entry 的 id（journal 游标）。
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: |
            text/event-stream。首帧是 `: connected` 注释，随后推送 entry 帧，直至 end 或 error。
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['no-store']
            X-Accel-Buffering:
              schema:
                type: string
                enum: ['no']
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : connected

                id: s=8f2c1a4d5e6b7c8d9e0f1a2b3c4d5e6f;i=1a2b;b=c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8;m=1f2e3d4;t=5f6a7b8c9d0e;x=9a8b7c6d5e4f3a2b
                event: entry
                data: {"cursor":"s=8f2c…","timestamp":"2026-10-21T09:14:02.418000Z","level":"info","message":"Started OpenBSD Secure Shell server.","truncated":false,"redacted":false,"binary":false,"unit":"ssh.service","identifier":"systemd","comm":"systemd","pid":812}

                event: end
                data: {"reason":"duration_limit"}

        '400':
          description: |
            参数不合法（VALIDATION_ERROR）。**在写响应头之前**完成校验，所以客户端拿到的是
            JSON 错误，而不是一条 200 的空流。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: 同一账号同时打开的流过多（VALIDATION_ERROR，HTTP 429）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 代理不可用（AGENT_UNAVAILABLE）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/shares:
    get:
      operationId: listShares
      summary: 共享列表与 Samba 能力报告（仅 admin）
      description: |
        CONTRACTS.md 第 7 节（P08.1 起），权限 admin：共享定义里有路径、账号名单与来源
        网段，合起来就是“谁能访问哪个目录”的完整答案。viewer 只在首页看数量与健康摘要。

        **两个状态字段回答的是不同的问题，不能互相替代**：

        - `definition.enabled` 是意图——这条共享的配置要不要生效；
        - `config_applied` 是事实——这份配置有没有写进 Samba 并被重载。

        P08.2 起 `config_applied` 可以是真的：配置真的写进了面板独占的托管文件
        `/etc/samba/upanel.d/upanel.conf`，主配置末尾接了一行 include，候选文件与合并
        后的配置都过了 testparm，并且 smbd 在跑、重载成功。`directory_prepared` 仍然只
        说目录与 POSIX ACL 准备好了——它可以为真而 `config_applied` 为假（目录备好了
        但服务没在跑、或配置还没写）。

        `service_state` 是第三个维度：smbd 没在跑的时候，一份完全正确的配置也提供不了
        任何访问，能力报告必须能把这件事说出来。

        能力报告与列表一起返回，是因为把两者分成两次请求，中间就会出现一小段时间界面
        显示“已启用、已生效”，而 Samba 那边还没有这一段。

        列表按名字稳定排序；没有共享时 `shares` 是 `[]`，不是 null。
      tags: [shares]
      responses:
        '200':
          description: 共享列表与能力报告。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ShareListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）；不是“没有共享”。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/shares/{id}:
    get:
      operationId: getShare
      summary: 单条共享（仅 admin）
      description: |
        CONTRACTS.md 第 7 节（P08.1 起），权限 admin。

        id 的形状是 `shr_` 加 32 位小写十六进制；形状不对在本层就返回 400，不透传任意
        字符串给代理（它会进日志与审计）。不存在的共享是 404，不是空对象。

        详情同样带能力报告：页面不该为“这条共享现在生效了吗”再发一次请求。
      tags: [shares]
      parameters:
        - $ref: '#/components/parameters/ShareID'
      responses:
        '200':
          description: 共享详情与能力报告。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ShareDetailData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/shares/{id}/connections:
    get:
      operationId: getShareConnections
      summary: 某一条共享此刻的连接状态（仅 admin）
      description: |
        CONTRACTS.md 第 7 节（P08.2 起），权限 admin。

        读的是 `smbstatus --json` 报出的 smbd 会话表，即**这台机器此刻的事实**，而不是
        登记表里的配置。它单独一条子路径而不是塞进详情，是因为连接每秒都可能变、定义不会：
        塞在一起就得让详情页跟着连接一起刷新，或者接受一份永远慢半拍的“详情”。

        **空列表不是“一切正常”。** 真机验证过：smbd 停掉之后 `smbstatus --json` 仍然以
        退出码 0 返回空的 sessions/tcons，与“没人连着”在输出上一模一样。所以响应里必带
        `service`，页面据此说“服务没在运行”而不是“没人连”。同理，`smbstatus` 缺失时
        列表为空且带一条 notice，那也不是“没人连”。

        id 的形状是 `shr_` 加 32 位小写十六进制；形状不对在本层 400，不透传任意字符串给
        代理。不存在的共享是 404，不是空报告。
      tags: [shares]
      parameters:
        - $ref: '#/components/parameters/ShareID'
      responses:
        '200':
          description: 连接状态报告；没有连接时 `connections` 是 `[]`，不是 null。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ShareConnectionsData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/share-accounts:
    get:
      operationId: listShareAccounts
      summary: 受管理共享账号列表（仅 admin）
      description: |
        CONTRACTS.md 第 7 节（P08.1 起），权限 admin。

        返回的每一条都**没有**密码、没有哈希，也没有 `secret_ref`——DTO 上就没有那些
        字段。`has_password` 只回答“这个账号在 Samba passdb 里设过密码没有”。

        账号只可能是面板自己创建的（`managed` 恒为 true）：系统上已存在的同名账号会被
        拒绝接管（ACCOUNT_NOT_MANAGED），而不是悄悄改它的密码。
      tags: [shares]
      responses:
        '200':
          description: 账号列表与能力报告；没有账号时 `accounts` 是 `[]`。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ShareAccountListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/secrets:
    post:
      operationId: createSecret
      summary: 上传一条秘密并拿回引用（仅 admin + CSRF + 再认证）
      description: |
        CONTRACTS.md 第 7、15 节（P08.1 起）。这是唯一一条“写”但不进任务链路的接口：
        它不改变主机状态，只是把一段明文交给代理加密保存并拿回引用。

        **只进不出**：协议里没有读取明文的路由，本接口也没有 GET 对应项。明文只出现在
        本次请求体里，服务端不缓存、不写日志、不回显；响应与错误信息里都不会出现它。

        `purpose` 是**闭集**，取值在代理侧登记：`smb_password`、`account_password`、
        `proxy_basic_password`、`backup_repository_password`、`notification_password`、
        `tls_private_key`、`sftp_private_key`、`app_env`。未登记的用途与内部用途
        （`totp_seed`，由 enrollment 流程生成）一律 400。

        未被任何配置引用的秘密 10 分钟后销毁；一旦被引用转为持久秘密。真正的系统变更
        （设 Samba 密码、写共享配置）仍走预检 + 任务，参数里只有 `secret_ref`。
      tags: [shares]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
      responses:
        '201':
          description: 已加密保存；只返回引用与生命周期。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SecretRefData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            用途不在闭集内、明文为空、超过该用途的长度上限，或请求体含未知字段
            （VALIDATION_ERROR）。错误信息里不含明文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 需要 admin、需要 CSRF 令牌，或需要 5 分钟内的密码再认证。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/proxies:
    get:
      operationId: getProxies
      summary: 代理站点列表（仅 admin）
      description: |
        CONTRACTS.md 第 9 节（P10.1 起）。返回面板里登记的代理站点定义，按 domain 升序
        稳定排序，同名按 id 兜底。

        **这一层不写 Nginx 配置**：`enabled` 是意图，不是事实。生成配置、`nginx -t`
        与 reload 是 P10.2 的 `proxy.apply` 任务，因此这里没有 `applied_*` 字段——
        填一个空值会让界面显示一个面板并不掌握的结论。

        `nginx` 块是主机现状摘要。读不到代理时 `read_error` 非空、`available` 为 false，
        与“主机上没有 Nginx”（`config_missing=true`）是两件事：前者让人去查代理，
        后者说明这台机器确实没有配置可冲突。
      tags: [proxy]
      security:
        - upanelSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: app_id
          in: query
          required: false
          description: 只返回关联该应用的站点。
          schema:
            type: string
            pattern: '^app_[0-9a-f]{32}$'
        - name: domain
          in: query
          required: false
          description: |
            只返回该域名（精确匹配）。输入会先按 IDNA 归一化，因此大写与末尾的点不影响
            结果；归一化失败是 400，不是“没找到”——静默返回空列表会让人以为站点不存在。
          schema:
            type: string
      responses:
        '200':
          description: 当页站点与 Nginx 现状摘要。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxySiteListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postProxy
      summary: 登记一个代理站点（仅 admin）
      description: |
        只登记定义，**不改主机**：本阶段没有任何代码写 /etc/nginx。

        写入前必须判断域名冲突。判不了就拒绝（503 AGENT_UNAVAILABLE），不是“先存下来
        再说”：没有代理就不知道主机上已经声明了哪些域名，存下一条“看起来没问题”的记录
        只会把冲突推到 P10.2 写配置那一刻。已被占用返回 409 并带证据（文件、行、原文）。

        `upstream_port` 不能等于管理面板自己的端口 9443：那等于把一个公网入口指向面板。

        `basic_auth_users` 的响应里只有 `name`，没有 `secret_ref`——引用也不靠“读出来再
        存回去”维持，因此修改用户列表时必须重新提供 `secret_ref`。
      tags: [proxy]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyDefinitionCreate'
      responses:
        '201':
          description: 已登记（尚未写入 Nginx）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxySite'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/proxies/nginx:
    get:
      operationId: getProxyNginxFacts
      summary: 主机 Nginx 现状（仅 admin）
      description: |
        CONTRACTS.md 第 9 节（P10.1 起）。列出读到的配置文件名、每个 server 块的
        `server_name` 与 `listen` 原文，以及解析失败的文件和没有跟随的 include。

        它自己的失败就是 503：用户点进来就是为了看这一步读到了什么，给一份空表会被
        读成“这台机器上没有 Nginx”。
      tags: [proxy]
      security:
        - upanelSession: []
      responses:
        '200':
          description: Nginx 现状。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxyNginxFacts'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/proxies/conflict:
    get:
      operationId: getProxyDomainConflict
      summary: 判断域名能否用于新站点（仅 admin）
      description: |
        CONTRACTS.md 第 9 节（P10.1 起）。`state` 是闭集 `clear|taken|unknown`。

        **`unknown` 不等于 `clear`**：读不到 Nginx、有文件解析失败、或有认不出的
        `server_name` 写法时，结论是判不了，写入会被拒绝。理由是 `nginx reload` 不会
        因为 `server_name` 撞车而失败——它只会安静地用第一个块，所以面板必须比 nginx
        更严格。

        `exclude_id` 用于修改：把自己那条记录排除掉，否则改一个站点的其它字段时会被
        自己的域名挡下来。
      tags: [proxy]
      security:
        - upanelSession: []
      parameters:
        - name: domain
          in: query
          required: true
          description: 待判断的域名；非法域名返回 400，不是“可用”。
          schema:
            type: string
        - name: exclude_id
          in: query
          required: false
          description: 修改场景下要排除的站点 id。
          schema:
            type: string
            pattern: '^site_[0-9a-f]{32}$'
      responses:
        '200':
          description: 结论与依据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxyDomainConflict'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/proxies/{id}:
    parameters:
      - $ref: '#/components/parameters/ProxySiteId'
    get:
      operationId: getProxy
      summary: 单个代理站点（仅 admin）
      tags: [proxy]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 站点定义。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxySite'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchProxy
      summary: 修改代理站点（仅 admin）
      description: |
        `version` 必填，与库中不一致返回 409 VERSION_CONFLICT。

        字段缺席表示“不改这一项”，`allowed_cidrs: []` 表示“清空”。只改域名时才重新
        判断冲突（并且排除自己），只改 app_id 时才重新确认应用存在——改一个超时不该
        因为代理临时不可用而失败。
      tags: [proxy]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyDefinitionPatch'
      responses:
        '200':
          description: 修改后的站点。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ProxySite'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteProxy
      summary: 删除代理站点（仅 admin）
      description: |
        只删面板里这条记录：不碰应用、不碰容器、不删 /etc/nginx 里的任何文件。
        `version` 必填（请求体 `{"version":N}` 或查询参数），不一致返回 409。
      tags: [proxy]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已删除。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    type: object
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/certificates:
    get:
      operationId: getCertificates
      summary: 证书列表（仅 admin）
      description: |
        CONTRACTS.md 第 9.3 节（P10.3 起）。返回面板里登记的证书记录，按 domain 升序
        稳定排序，同名按 id 兜底。

        这一层只读记录，`renewal_state` 是**读的时候按 `not_after` 算出来的**
        （valid / expiring / expired / unknown，临期窗口 21 天），不是库里的一列：
        存下来的结论会过期，而过期了的结论比没有更糟。

        **没有私钥路径，也没有私钥内容。** `key_storage` 只回答“私钥由谁保管”这一个
        问题——certbot 签发时私钥留在 `/etc/letsencrypt`（root 0700，面板连读都不读），
        手动导入时它经 `POST /secrets`（用途 `tls_private_key`）进代理的加密库，
        由代理物化成 0600 root 的文件。

        `staging=true` 是显式列，不靠“看 issuer 猜”：staging 证书浏览器不认，
        界面上必须一眼可见。
      tags: [proxy]
      security:
        - upanelSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: domain
          in: query
          required: false
          description: |
            只返回该域名（精确匹配）。输入先按 IDNA 归一化，因此大写与末尾的点不影响
            结果；归一化失败是 400，不是“没找到”——静默返回空列表会让人以为证书丢了。
          schema:
            type: string
      responses:
        '200':
          description: 当页证书记录。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/CertificateListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/certificates/{id}:
    get:
      operationId: getCertificate
      summary: 证书详情与现场事实（仅 admin）
      description: |
        CONTRACTS.md 第 9.3 节（P10.3 起）。`certificate` 是库里的记录，`observed`
        是**此刻盘上是什么样**——由代理的 `certificate.state` 只读查询回答。

        `observed.available=false` **不影响状态码**：记录还在，为“读不到现场”整页 503
        会把用户已经掌握的事实（这张证书覆盖什么、绑在哪个域名）一起丢掉。此时
        `observed.reason` 说明是“没有代理连接”还是“代理不可用”，其余字段是零值；
        界面必须显示“不知道”，不能显示“证书不存在、有效期为零”。

        `observed` 里同样没有路径：代理自己知道 `cert_path`/`key_path`（排查用），
        这一层用显式结构体接住响应，多出来的字段自然丢掉。`key_present` 与
        `key_mode` 的用途是让“私钥权限被人改松了”这件事在界面上看得见。
      tags: [proxy]
      security:
        - upanelSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^crt_[0-9a-f]{32}$'
      responses:
        '200':
          description: 记录与现场事实。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/CertificateDetailData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/certificates/uploads:
    post:
      operationId: uploadCertificate
      summary: 上传公钥证书并暂存（仅 admin + CSRF + 再认证）
      description: |
        CONTRACTS.md 第 9.3 节（P10.3 起）。手动导入的第一步：把一张**公钥**证书链
        交给面板，拿回一个 10 分钟内有效、一次性使用的引用，随后用
        `certificate.import` 任务把它装上主机。

        只暂存：**不写库、不碰主机**。真正落到 `/etc/ssl/upanel` 的是任务。

        **夹带私钥直接拒绝**（400），不“忽略多余的块”——那样私钥就已经进了这个进程的
        内存与可能的日志。私钥请走 `POST /secrets`（用途 `tls_private_key`），导入时用
        `private_key_secret_ref` 引用它。本接口的响应里没有 PEM 内容：上传方刚给过它。

        `multipart/form-data`，文件字段名 `certificate`，上限 1 MiB。暂存按会话绑定，
        别的会话拿不到；同一用户最多同时持有少量暂存，满了返回 429。
      tags: [proxy]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CertificateUploadRequest'
      responses:
        '201':
          description: 已暂存；返回这次上传的解析结果与引用。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/CertificateUploadCreated'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            不是合法的 multipart、缺少 `certificate` 字段、内容里有私钥，或内容无法解析
            成证书（PEM 无效、只有 CA 证书没有叶子证书）。错误信息里不含上传内容。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
