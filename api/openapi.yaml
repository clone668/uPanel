      description: |
        CONTRACTS.md 第 10.1 节（P05.1 起），权限 V。经代理的 services.list 查询取回
        最近一次采集的快照；Web 不直接读 systemd。

        采集失败时**不清空列表**：status 为 error，error 说明原因，units 仍是上一次
        成功的内容，collected_at 是那次的时间。空列表会被读成“这台机器没有服务”，
        所以只有确实采到了空结果时才返回空数组。

        capabilities 只列出当前状态与保护规则下真正能执行的操作，受保护单元一律为空数组。
        写操作必须走 service.control 的预检与任务，不在本接口提供任何捷径。

        truncated 为 true 表示单元数超过上限（1000）被截断，不是“只有这些”。
      tags: [services]
