                properties:
                  data:
                    $ref: '#/components/schemas/FirewallState'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/backup/repositories:
    get:
      operationId: listBackupRepositories
      summary: 备份仓库定义列表（仅 admin）
      description: |
        CONTRACTS.md 第 12.2 节（P12.2 起）。这一组编辑的是**代理里那份定义**：面板不存
        第二份仓库表，因此代理不可用时整组回 503 `AGENT_UNAVAILABLE`，而不是给一份空列表
        （空列表会被读成"这台机器上还没有配置备份"）。

        `repository_state_query` 说明"这个仓库初始化了没有"要去哪儿问：那是
        `backup.repository.state` 的只读查询，因为它要现采（restic 读 config、SFTP 拨号
        加主机密钥核对），塞进列表等于给每条都加一次拨号。

        `password_secret_ref` / `credential_secret_ref` 是**引用**，不是明文：面板从不持有
        仓库口令与私钥，它们只进代理的加密存储。
      tags: [backup]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 仓库定义列表。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/BackupRepositoryListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createBackupRepository
      summary: 登记仓库定义（仅 admin + CSRF + 再认证）
      description: |
        只登记元数据，一个字节都不写远端；初始化真实仓库是 `backup.repository.initialize`
        的预检 → 任务。要再认证，是因为这条定义引用仓库口令与 SFTP 私钥——改一次定义就是
        改一次"备份会往哪儿写"。

        校验按 `backend` 判别：`local` 用 `root_id` + `relative_path`，不接受任何远端字段；
        `sftp` 用 `host`/`port`/`username`/`remote_path`/`host_key_fingerprint` + 私钥引用。
        主机密钥指纹必须显式登记，不接受"第一次连上就信"。名字重复是 400（这次请求本身
        不合法），不是 409。
      tags: [backup]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRepositoryCreateRequest'
      responses:
        '201':
          description: 已登记。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/BackupRepository'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
