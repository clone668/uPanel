  /api/v1/system/summary:
    get:
      operationId: getSystemSummary
      summary: 系统概况（CPU、内存、负载、网络、主机信息）
      description: |
        返回代理最近一次采集的快照（CONTRACTS.md 第 3 节，权限 V）。

        采集在代理侧按 5 秒轮询 /proc 与 /sys，查询只读快照：同一窗口内反复刷新拿到
        同一份数据与同一个 collected_at，不会因为刷新快慢得到互相矛盾的数。

        这份响应里没有“补零”的数字：
        - 每段有自己的 status（ok / error / unavailable）与 error 说明；
        - 最近一次采集失败的段保留最近一次成功的值，collected_at 停在那次成功的时间，
          界面据此显示“陈旧”，而不是把 0 当成真实值；
        - 首次采样、计数器重置、跨重启时，usage_percent 与 *_bytes_per_second 是 null；
        - stale 只说明快照本身太旧（超过 3 个采集间隔），不代表各段采集成功。

        字节数与计数器是十进制字符串（与第 1 节一致），百分比与速率是数字。
      tags: [system]
      responses:
        '200':
          description: 最近一次采集快照；可能 degraded（部分段失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemSummary'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），此时没有可展示的采集数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/metrics:
    get:
      operationId: getSystemMetrics
      summary: 历史监控（过去的 CPU、内存、负载、网络、容量）
      description: |
        返回请求区间内的时序样本（CONTRACTS.md 第 3 节，权限 V）。

        与 `/system/summary` 的分工：那个接口回答“现在什么样”，这个接口回答“过去怎么走的”。
        样本由面板进程按 2 秒轮询代理快照、按 `collected_at` 去重后写入本地库，再做分钟与
        小时聚合；查询只读样本表，不触发采集。

        **缺失的数据就是没有点**：
        - 采集失败、代理不可用、值为 null 的那些时刻不会写样本，也不会补 0；
        - 响应里没有的桶就是没有测到，每个序列用 `missing_points` 如实计数；
        - `observed_from` / `observed_to` 都是 null 表示这个区间真的一点数据都没有，
          与“有数据但中间断了”是两件事。

        **粒度与点数**：单次最多 1440 个点。点数超了不报错，而是按时间跨度落到
        raw（最近 24 小时）→ minute（30 天）→ hour（365 天）里覆盖得住的最细一层，
        再把步长加粗到需要的粗细。响应里的 `resolution` 与 `step_seconds` 是**实际**
        用的值，界面据此标注，不要假设它就是 5 秒数据。

        `enabled=false` 表示这个进程没有在记历史（演示模式），此时 `series` 为空、
        `reason` 说明原因；界面应显示“未开启历史监控”，而不是“这段时间没有数据”。
      tags: [system]
      parameters:
        - name: scope
          in: query
          required: true
          description: 样本类别闭集：host、interface、filesystem。
          schema:
            type: string
            enum: [host, interface, filesystem]
        - name: target_id
          in: query
          required: false
          description: |
            目标标识：host 为空（不传），interface 是网卡名，filesystem 是挂载点路径。
            可重复传递，也可逗号分隔；不传表示该 scope 下的全部目标。
          schema:
            type: string
            maxLength: 512
        - name: metric
          in: query
          required: false
          description: |
            指标名，必须属于该 scope（见 `/system/metrics/status` 的 `metrics`）。
            可重复传递，也可逗号分隔；不传表示该 scope 下全部登记过的指标。
            未知指标名返回 400，而不是 200 加空数组——空数组会被读成“过去没有数据”。
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          required: false
          description: 区间起点（含）。不传时取 `to - 1 小时`。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 区间终点（不含）。不传时取服务端当前时间；不得晚于当前时间 2 分钟以上。
          schema:
            type: string
            format: date-time
        - name: step
          in: query
          required: false
          description: |
            期望的桶宽（秒，正整数）。不传则自动挑一个不超 1440 点的密度。
            低于所选粒度的桶宽时会被抬到桶宽；点数仍超上限时服务端继续加粗，
            以响应里的 `step_seconds` 为准。
          schema:
            type: integer
            minimum: 1
            maximum: 31536000
      responses:
        '200':
          description: 查询结果；`enabled=false` 时表示这个进程没有记历史。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemMetricQueryResult'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: 参数不合法（scope 缺失或不在闭集、未知指标、时间写错、步长非法）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: 读取样本库失败。正文不包含内部错误原文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/metrics/status:
    get:
      operationId: getSystemMetricsStatus
      summary: 历史监控的状态（为什么图是空的）
      description: |
        回答“这个进程到底在不在记历史”（CONTRACTS.md 第 3 节，权限 V）。

        查询接口只给曲线，一条空曲线什么也说明不了：可能是采集在跑但代理刚断开，
        可能是配置里关了采集，可能是这台机器还没收到过样本。这里把三种情况分开：

        - `enabled`：库在、能回答历史问题；
        - `collecting`：采集循环在这个进程里跑着；
        - `reason`：`enabled=true` 且 `collecting=false` 时说明是哪一种原因；
        - `samples`：库里各粒度（raw / minute / hour）与 total 的行数；
        - `last_sample_at`、`last_error`、`last_error_at`：本进程的运行时事实；
        - `metrics`：产品支持的指标清单；`series`：这台机器的历史里真正出现过的序列。

        `last_sample_at` 与 `inserted` / `aggregated` / `pruned` 说的是**这个进程**，
        重启后从零开始，不是“这台机器”。行数是全表统计，不要按曲线刷新频率轮询它。
      tags: [system]
      responses:
        '200':
          description: 状态快照；`enabled=false` 表示这个进程没有记历史。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemMetricsStatus'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: 读取样本库失败。正文不包含内部错误原文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/topology:
    get:
      operationId: getStorageTopology
      summary: 块设备拓扑（nodes、edges、snapshot_version）
      description: |
        返回代理最近一次扫描的块设备拓扑（CONTRACTS.md 第 6 节，权限 V）。

        采集全部只读：读 /sys/block、/proc/self/mountinfo、/proc/swaps、/dev/disk/by-*
        与整盘最前面的 34 个扇区（判断分区表类型与空闲区），不执行任何外部命令。
        扫描在代理侧按 5 秒循环进行，查询只读快照：同一窗口内反复刷新拿到同一份拓扑
        与同一个 snapshot_version。

        edges 的 from 是**子设备/消费者**，to 是**父设备/底层提供者**：
        sda1 --partition_of--> sda，dm-0 --depends_on--> sda2。保护与锁沿这个方向递归向上追。

        snapshot_version 只覆盖 nodes 与 edges 的内容，不含容量与采集时间：
        内容不变则版本不变，执行前的幂等与预检比对靠它。

        status 是**最近一次扫描尝试**的结果。扫描失败时 nodes/edges/collected_at 停在上一次
        成功的样子，status=error 并给出 error 原因——读不到 sysfs 不等于服务器上没有磁盘，
        因此失败时不会把节点清空。
      tags: [storage]
      responses:
        '200':
          description: 最近一次扫描快照；可能标记为 error（保留上一次成功的节点）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageTopology'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），此时没有可展示的拓扑。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/devices:
    get:
      operationId: listStorageDevices
      summary: 块设备列表（含系统盘保护判断）
      description: |
        与 /storage/topology 读同一份快照（CONTRACTS.md 第 6 节，权限 V）。
        因此列表里每一台设备的 protection、holders 与 collected_at 都与拓扑里的完全一致。

        每台设备至少包含 Device 必需字段。P04.2 起另有三个附加字段（见 CONTRACTS.md 第 6 节）：
        protection（系统盘保护与理由）、holders（谁依赖它）、swap（活动交换区）。

        health 在 P04.3 起由 SMART / NVMe 健康日志填充，判定依据见 StorageHealth；
        读不到、盘在休眠或桥接不被支持时是 unknown 或 sleeping，绝不写成 healthy。

        io 在 P04.3 起填充：每台设备只报自己那一行 diskstats 计数，从不相加。

        capabilities 在本阶段恒为空数组：写动作登记表要到 P07 才开始有内容，
        这里不能预告未实现的能力。未知类型的设备更不能暗示可以破坏性操作。
      tags: [storage]
      responses:
        '200':
          description: 设备列表与采集元数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageDeviceList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/devices/{id}:
    get:
      operationId: getStorageDevice
      summary: 单台设备详情（含直接相关的关系边）
      description: |
        返回一台设备及其直接相关的拓扑边（CONTRACTS.md 第 6 节，权限 V）。

        id 是**内核设备名**（sda、sda1、dm-0、md0、loop0）。它在一次启动内唯一，
        用作 API 路径参数；判断“是不是同一块盘”要用 identity_fingerprint，
        不能用 id——名字会随启动与插槽变化。

        id 只作为标识使用：它不会被拼成路径或命令。不存在的设备返回 404，而不是空对象。
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          description: 内核设备名，例如 sda、sda1、dm-0。
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9._-]+$'
      responses:
        '200':
          description: 设备详情。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageDeviceDetail'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/volumes:
    get:
      operationId: listStorageVolumes
      summary: 受管理卷列表（含现场观测状态与容量）
      description: |
        CONTRACTS.md 第 6.5 节（P07.4 起），权限 V。返回代理当前登记的全部受管理卷。

        observed_state 是代理**现场**读超级块与挂载表之后算出来的，不是把 desired_state
        抄一遍：两者不一致（盘没插、UUID 变了、挂在别处）恰恰是页面要提醒的事。

        capacity 只在真正挂载且容量读取成功时存在，否则是 null——不能拿 0 字节冒充“没读到”。

        dependencies 在 P07.4/P07.5 恒为空数组（应用的共享与备份模块尚未实现），
        空数组的意思是“没有依赖”，不是“没查”。

        排序按 mount_path 稳定输出，便于页面与验收脚本做 diff。
      tags: [storage]
      responses:
        '200':
          description: 受管理卷列表；没有卷时 volumes 是 `[]`，不是 null。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageVolumeList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/volumes/{id}:
    get:
      operationId: getStorageVolume
      summary: 单个受管理卷
      description: |
        CONTRACTS.md 第 6.5 节（P07.4 起），权限 V。

        id 的形状是 `vol_` 加 32 位小写十六进制；形状不对在本层就返回 400，
        不透传任意字符串给代理（它会进日志与审计）。不存在的卷是 404，不是空对象。
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          description: 卷标识，形如 vol_ac1ceea48853ce6d068878632d603a14。
          schema:
            type: string
            pattern: '^vol_[0-9a-f]{32}$'
      responses:
        '200':
          description: 卷详情。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageVolume'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/volumes/{id}/blockers:
    get:
      operationId: getStorageVolumeBlockers
      summary: 这个卷现在为什么卸载不了（占用详情）
      description: |
        CONTRACTS.md 第 6.5 节（P07.4 起），**admin**（占用里有进程 PID 与挂载点，
        比卷详情更细）。

        busy 是结论，只有真的有人打开着这块设备或这个挂载点上的文件、被 dm/md 消费、
        是活动交换区，或面板侧有应用/共享/备份依赖时才为真。**挂着但空闲不算忙**——
        那种卷能干净卸载，预检也会放行，两处口径一致。

        两种占用都要查：umount 撞的 EBUSY 来自“文件系统上还有打开的文件”，
        而 dd/mkfs 这类直接开块设备的进程不会让 umount 失败但同样意味着别动它。

        查不到就报“查不到”：读不到 /proc、扫描出错或没配占用检查器时 busy=true，
        绝不返回空列表冒充“没人用”。
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          description: 卷标识，形如 vol_ac1ceea48853ce6d068878632d603a14。
          schema:
            type: string
            pattern: '^vol_[0-9a-f]{32}$'
      responses:
        '200':
          description: 占用详情与检查时间。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageVolumeBlockers'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/services:
    get:
      operationId: listServices
      summary: systemd 服务单元列表（含保护名单与可执行动作）
      description: |
        CONTRACTS.md 第 10.1 节（P05.1 起），权限 V。经代理的 services.list 查询取回
        最近一次采集的快照；Web 不直接读 systemd。

        采集失败时**不清空列表**：status 为 error，error 说明原因，units 仍是上一次
        成功的内容，collected_at 是那次的时间。空列表会被读成“这台机器没有服务”，
        所以只有确实采到了空结果时才返回空数组。

        capabilities 只列出当前状态与保护规则下真正能执行的操作，受保护单元一律为空数组。
        写操作必须走 service.control 的预检与任务，不在本接口提供任何捷径。

        truncated 为 true 表示单元数超过上限（1000）被截断，不是“只有这些”。
      tags: [services]
      responses:
        '200':
          description: 服务单元列表与采集元数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），或本机没有可用的 systemctl。
