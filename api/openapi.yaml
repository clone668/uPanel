  /api/v1/operations/preflight:
    post:
      operationId: postOperationsPreflight
      summary: 生成预检（仅 admin）
      description: |
        系统写动作的第一步（CONTRACTS.md 4.1）。预检本身不写磁盘、不停止服务、不安装软件：
        它向特权代理要一份计划——规范化参数、目标身份指纹与状态版本快照、影响、阻塞项、
        是否需要再认证与确认短语——并把绑定信息（用户、会话、动作、参数哈希、状态版本、
        到期时间）记在服务端。

        有效期 120 秒，从代理签发的时刻起算。expires_at 是代理给出的唯一真值：
        客户端只做展示与倒计时，不得自己推算或修改。

        allowed=false 仍返回 200：这表示“计划已经生成，但当前条件不允许执行”，
        blockers 说明原因。真正提交在 POST /jobs（P03.2），那一步会重新校验有效期、
        用户与会话绑定、目标状态版本、再认证窗口和确认短语。

        确认短语由服务端生成，只在本响应里出现一次明文；服务端保存的是它的哈希，
        日志、审计与数据库都不记录明文。不要求短语的动作返回 confirmation_phrase=null，
        而不是省略字段——省略会让客户端分不清“不需要”和“服务端漏给了”。

        响应刻意不含目标状态版本与代理内部引用：它们是服务端绑定信息，前端拿到也没有正当用途。

        本接口不检查再认证窗口：再认证在执行阶段强制，提前拒绝只会让人看不到预检里
        的影响与阻塞项。params 缺省按空对象 {} 处理；是否已登记这个动作由代理的动作
        注册表决定，未登记的动作返回 400 VALIDATION_ERROR。
      tags: [operations]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightRequest'
      responses:
        '200':
          description: 预检已生成；allowed 说明当前是否允许执行。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/PreflightData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            请求体不是 application/json、不是合法 JSON、含未知字段（VALIDATION_ERROR），
            动作名形状不合法或代理不认这个动作（VALIDATION_ERROR），或参数不是 JSON 对象
            或超过 64 KiB（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          description: 特权代理不可用（AGENT_UNAVAILABLE）；客户端应提示稍后重试。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs:
    post:
      operationId: postJobs
      summary: 提交任务（仅 admin）
      description: |
        系统写动作的第二步（CONTRACTS.md 4.2）。请求只带预检标识与确认短语：
        不接受 action 或 params，因此提交阶段无法替换目标，参数一律按预检恢复。

        必须携带 Idempotency-Key。相同用户 + 相同接口 + 相同键 + 相同请求返回原任务
        （202，同一个 job_id）；相同键但请求不同返回 409 IDEMPOTENCY_CONFLICT。

        预检是一次性凭据：已被使用、已过期、绑定的会话已轮换、用户已变化的预检都不能再提交。
        动作是否可安全取消由动作策略决定，客户端不得自行显示取消入口。

        服务端先写 durable job 与稳定的 operation_id，再向代理提交。因此本接口返回 202
        只表示“任务已被接受”，不表示系统动作已成功；结果必须通过 GET /jobs/{id} 读取。
        代理连不上时任务保持 queued（待对账），客户端应稍后重试同一键或查询任务，
        不得生成新的预检再提交一次。
      tags: [operations]
      security:
        - upanelSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '202':
          description: 任务已持久接受并已向代理提交（或留待对账）；不代表动作成功。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/JobSubmitData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            缺少或不合法的 Idempotency-Key、请求体不是 application/json、含未知字段、
            不是合法 JSON（VALIDATION_ERROR）。

            另有一类**容易误解**的 400：预检当时 allowed=true，提交时代理重新判决为不允许
            （例如 occupier 恰好在这几百毫秒里出现），代理回 409 VALIDATION_ERROR
            “当前状态不允许执行：<阻塞码>”，而 VALIDATION_ERROR 的对外状态码是 400
            （CONTRACTS.md 第 1 节、DECISIONS Q200）。这不是“请求写错了”，是状态变了；
            这次的提交已经落库为 failed/rejected 的任务行，重新预检即可。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 不是 admin（FORBIDDEN），或不在 5 分钟再认证窗口内（REAUTH_REQUIRED）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 预检不存在或不属于当前账号（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            幂等键已用于另一个请求（IDEMPOTENCY_CONFLICT）；预检已过期（PREFLIGHT_EXPIRED）；
            预检已被使用或会话已轮换（PREFLIGHT_STALE）；预检结论为不允许（DEPENDENCY_BLOCKED）；
            或代理在提交时判定目标已变化（PREFLIGHT_STALE / DEVICE_IDENTITY_CHANGED）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          description: 特权代理不可用（AGENT_UNAVAILABLE）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      operationId: getJobs
      summary: 任务摘要列表
      description: |
        返回当前账号提交的任务摘要，按创建时间倒序（CONTRACTS.md 4.3）。
        列表不做逐条对账：它只反映服务端最后一次与代理同步的状态；要精确状态请读单条任务。
        不包含原始参数与日志——这两样在 P03.3 才按 admin 权限开放。
      tags: [operations]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 任务摘要列表。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/JobListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: limit 不是 1—200 的整数（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: 任务状态、步骤、结果与错误
      description: |
        读取单个任务（CONTRACTS.md 4.3）。非终态任务会按稳定的 operation_id 向代理对账一次，
        因此浏览器关闭、Web 重启后仍能找到同一次执行——对账只读，绝不重新提交。

        progress_percent 在不知道进度时是 null：不得用一个假定时器从 0 涨到 100。
        result 至少包含 outcome（verified、accepted、rolled_back、partial、unknown）、
        verified_at、observed_state、recovery_hint；只有核验过真实结果的任务才是 succeeded。
        cancellation_requested 是独立布尔字段：它表示“已请求取消”，不是“已取消”。
      tags: [operations]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 任务视图。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/JobData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 任务不存在或不属于当前账号（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/cancel:
    post:
      operationId: postJobsCancel
      summary: 请求安全取消（仅 admin）
      description: |
        请求安全取消（CONTRACTS.md 4.3）。只有动作策略允许取消、且任务尚未进入终态时才接受。

        返回 202 表示“取消请求已记录”，不表示动作已经停下：随后的状态可能是 canceled，
        也可能因为已经进入不可打断阶段而以 failed 结束。cancellation_requested 会如实回显。

        不可取消的动作（例如格式化、分区写入这类一旦开始必须走完的操作）返回 409：
        客户端本来就不该显示取消入口——cancellable 字段在预检与任务视图里都给出了。
      tags: [operations]
      security:
        - upanelSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 取消请求已记录。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/JobData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 任务不存在或不属于当前账号（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            该动作不可取消（VALIDATION_ERROR，HTTP 409），或任务已进入终态（VERSION_CONFLICT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/events:
    get:
      operationId: getJobEvents
      summary: 任务事件流（SSE，仅 admin）
      description: |
        任务的实时事件流（CONTRACTS.md 4.3）。这是 GET，靠会话 Cookie + 同源 Origin 校验，
        不要求 X-CSRF-Token（EventSource 无法自定义请求头）。

        帧格式：`id: <seq>`、`event: status|progress|log|gap`、`data: {seq,kind,payload,created_at}`。
        `id` 是任务内持久递增的 seq，客户端重连时浏览器会带 `Last-Event-ID`，
        服务端从该位置续发（也接受查询参数 `last_event_id` 便于验收脚本）。
        每 15 秒发送一行注释心跳（`: keepalive`），避免中间设备掐掉空闲连接。

        重连**不会**重新执行任务：任务的实际推进只由代理完成，事件流是只读视图。
        历史被容量上限回收后，服务端先发一帧 `gap`（payload.reason=history_pruned），
        客户端应重新拉取 GET /jobs/{id} 与第一页日志，而不是假设“没有新事件”。

        每个账号同时最多 4 条流；超出返回 429，避免慢客户端吃满文件描述符。
        慢客户端会被写超时断开，客户端随后按 Last-Event-ID 重连。
      tags: [operations]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
          description: 已收到的最后一个事件 seq；缺省表示从头补发。
        - name: last_event_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
          description: 与 Last-Event-ID 等价，仅用于调试与验收脚本。
      responses:
        '200':
          description: |
            text/event-stream。首帧是 `: connected` 注释，随后按 seq 升序推送事件。
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['no-store']
            X-Accel-Buffering:
              schema:
                type: string
                enum: ['no']
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : connected

                id: 7
                event: progress
                data: {"seq":7,"kind":"progress","payload":{"step":"ping_done"}}

                id: 8
                event: status
                data: {"seq":8,"kind":"status","payload":{"status":"succeeded"}}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 任务不存在或不属于当前账号（NOT_FOUND）。归属校验在写响应头之前完成，
            因此客户端拿到的是 JSON 错误，而不是一条 200 的空流。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 同一账号打开的事件流过多（VALIDATION_ERROR，HTTP 429）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/logs:
    get:
      operationId: getJobLogs
      summary: 任务脱敏日志分页（仅 admin）
      description: |
        读取任务的日志行（CONTRACTS.md 4.3）。只返回 kind=log 的事件，按 seq 升序。

        游标是不透明字符串：把上一页返回的 `next_cursor` 原样带回来即可。
        非法游标返回 400，而不是悄悄从头开始（那会让“加载更多”变成无限循环）。

        每个任务最多保留最近 1000 行日志（环形回收：超出时删最旧的日志行，
        状态与进度事件永不删除），因此历史可能在长期任务里被裁掉——
        此时事件流会给 gap，日志里也只剩最近的部分。
      tags: [operations]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: 上一页返回的 next_cursor；缺省从第一页开始。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 一页日志。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/JobLogsData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 任务不存在或不属于当前账号（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/files/roots:
    get:
      operationId: listFileRoots
      summary: 受管理文件根（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.1 起），权限 admin。整组文件接口都是 admin：
        文件内容就是服务器内容（配置里的凭据、别人的数据、应用日志），PLAN.md 第 15 节
        把文件管理列为管理员能力，viewer 在这里得到 403，而不是“去掉几行的只读视图”。

        返回的是**配置文件里登记的根**，不是文件系统里的挂载点。它同时是“当前能管理
        什么”的唯一来源：请求里没有任何绝对路径字段，只有 root_id 与根内相对路径；
        未登记的 root_id 是 404，不会退回到“按路径找找看”。

        `agent.files.roots[i].path` 不能是 `/`——那等于把整个服务器文件系统登记成一个
        文件根，配置校验直接拒绝并让代理启动失败，错误信息指向该字段。界面能管理的
        范围因此在数据上就只有一个根列表。

        capacity 为 null 表示本次没读出来，原因见 capacity_error；**null 不是
        “0 字节可用”**，界面不得显示成磁盘满。available=false 的根显示成不可用，
        不是显示成空目录。没有登记任何根时返回 `roots: []`，界面据此说“尚未配置
        文件根”，而不是渲染一个空下拉框。
      tags: [files]
      responses:
        '200':
          description: 已登记的文件根列表。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FileRootsData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/list:
    get:
      operationId: listDirectory
      summary: 列目录（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.1 起），权限 admin。在根句柄上按 openat2 解析
        （RESOLVE_BENEATH|RESOLVE_NO_MAGICLINKS|RESOLVE_NO_XDEV|RESOLVE_NO_SYMLINKS），
        不跟随 symlink，也不跨入根下的其它挂载。

        path 是根内相对路径，空串表示根自身；绝对路径与 `..` 段一律拒绝（422
        PATH_OUTSIDE_ROOT），不接受“先规范化再放行”——规范化会把越界意图抹掉。
        形状问题（空段、`.` 段、超长、非法 UTF-8、NUL）是 400 VALIDATION_ERROR。

        entries 的 type 是闭集 file|dir|symlink|other；mode 是四位八进制字符串
        （`"0644"`，不是 400）；size_bytes 是十进制字符串；owner 只给数字 uid/gid，
        不查账号名（一次列举不该为了显示名字把请求挂在 NSS 上）。symlink 的 version
        与 mtime 描述链接本身，不描述目标。other 覆盖设备、FIFO、socket：能列出，
        绝不被读取。

        分页是键集分页：cursor 是上一页最后一个 name，下一页从它之后开始（不是
        offset）；页大小固定 200，因此同一个游标总是同一个起点。next_cursor 为 null
        表示没有下一页（与 /jobs、/logs、/users 一致），不是空串。

        单次列举最多扫 50 000 个名字，超出时 truncated=true：这是“列出的不是全部”，
        界面必须说明，不得当成完整列表。
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilesRootID'
        - $ref: '#/components/parameters/FilesPath'
        - $ref: '#/components/parameters/FilesCursor'
      responses:
        '200':
          description: 一页目录项。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FileListPage'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: 参数形状不合法（VALIDATION_ERROR）或目标不是目录。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: root_id 未登记，或根内没有这个路径（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 根此刻不可用（ROOT_UNAVAILABLE）：目录不存在、被重新挂载或身份与登记时不一致。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 路径越界或不被策略接受（PATH_OUTSIDE_ROOT）：绝对路径、`..`、符号链接、跨挂载。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: 平台没有 openat2 这套解析机制（NOT_IMPLEMENTED），拒绝真实文件操作而不是退化比较字符串。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/text:
    get:
      operationId: readFileText
      summary: 读 UTF-8 文本（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.1 起），权限 admin。打开方式固定
        `O_NOFOLLOW|O_NONBLOCK`，打开后对**同一个句柄** fstat：必须是普通文件、
        nlink 必须为 1、dev 必须等于根所在的 dev、大小不超过 1 MiB，version 也取自
        这一次 stat。因此“检查的是不是被读的那一份”没有中间窗口。

        expected_version 可选：非空时必须与句柄上的 version 一致，否则 409
        VERSION_CONFLICT。P06.1 只是读，但它让“版本在句柄上核验”这句话可以被验证，
        而不是只能被相信。

        内容必须是合法 UTF-8 且不含 NUL，否则 422 FILE_NOT_TEXT——二进制不是文本，
        不猜编码、不做替换字符降级。上限 1 MiB 超出为 413。

        version 的形状是 `v1-<dev>-<ino>-<size>-<mtime 纳秒>`（十六进制）。它不是哈希，
        不承诺跨挂载稳定，客户端不得解析或推算。
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilesRootID'
        - $ref: '#/components/parameters/FilesFilePath'
        - $ref: '#/components/parameters/FilesExpectedVersion'
      responses:
        '200':
          description: 文本内容与句柄版本。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FileTextData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: 参数形状不合法（VALIDATION_ERROR），或目标不是普通文件。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: root_id 未登记，或根内没有这个路径（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 根不可用（ROOT_UNAVAILABLE）或 expected_version 不匹配（VERSION_CONFLICT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 文件超过 1 MiB 文本上限（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            路径越界（PATH_OUTSIDE_ROOT）、有多个硬链接（同样归 PATH_OUTSIDE_ROOT：
            这个 inode 在根外可能还有别的名字），或内容不是 UTF-8 文本（FILE_NOT_TEXT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/download:
    get:
      operationId: downloadFile
      summary: 流式下载普通文件（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.1 起），权限 admin。响应体是文件**原始字节**，
        不是 JSON：代理先写一行 JSON 头（name、size_bytes、version、mtime）再写字节，
        Web 侧按该头设置 Content-Length 并把字节原样转发，因此头里描述的就是这一份
        字节，不会出现“头说 100 字节、实际 0 字节”的错位。

        固定响应头：Content-Type `application/octet-stream` 与
        X-Content-Type-Options `nosniff`（浏览器永远不把这里的内容当成 HTML/脚本渲染）、
        Cache-Control `no-store`、Content-Disposition `attachment` 且同时给 ASCII
        退化名与 RFC 5987 的 UTF-8 名（控制字符丢弃、引号与反斜杠替换，响应头里不会
        出现换行）。X-UPanel-File-Version 带本次下载的 version，前端据此判断“下载的是
        不是列表里那一份”。

        被拒绝的下载返回 JSON 错误信封（application/json），绝不是 octet-stream——
        否则浏览器会把错误当文件存下来。中途失败时响应头已经发出，浏览器看到的是
        “文件没下完”，而不是一段被当成文件内容的错误 JSON；服务端如实记日志。
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilesRootID'
        - $ref: '#/components/parameters/FilesFilePath'
        - $ref: '#/components/parameters/FilesExpectedVersion'
      responses:
        '200':
          description: 文件原始字节。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-UPanel-File-Version:
              $ref: '#/components/headers/FileVersion'
            Content-Disposition:
              description: 'attachment，含 ASCII 退化名与 RFC 5987 的 UTF-8 名。'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 固定 `no-store`。
              required: true
              schema:
                type: string
                enum: ['no-store']
            X-Content-Type-Options:
              description: 固定 `nosniff`。
              required: true
              schema:
                type: string
                enum: [nosniff]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: root_id 未登记，或根内没有这个路径（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 根不可用（ROOT_UNAVAILABLE）或 expected_version 不匹配（VERSION_CONFLICT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 路径越界（PATH_OUTSIDE_ROOT），或目标有多个硬链接（同样归 PATH_OUTSIDE_ROOT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/uploads:
    post:
      operationId: createFileUpload
      summary: 创建暂存上传（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.2 起），权限 admin + CSRF。声明“要把多少字节放到
        哪个根内的哪个路径”，代理在**根内的保留目录** `.upanel/staging` 上建立暂存，
        返回一次性 upload_id 与过期时间。

        **上传不等于落地**：创建暂存与写入内容都不会改变目标路径的任何一个字节。
        要变成真文件必须再走 file.commit_upload 的预检与任务（POST /operations/preflight
        + POST /jobs），因此审计里是两条记录，而不是一条“POST 之后什么都可能已经发生”。

        size_bytes 是十进制字符串（与列表里的 size_bytes 同一套规则，前端不得用
        Number 做精确运算）。它同时是两个东西：容量预留的依据，以及传输完整性的判据——
        实收字节数必须刚好等于它，少一个字节也不提交。

        expected_version 描述的是**目标文件**此刻的版本：非空表示“我知道它现在是这一份”，
        目标已存在而它为空时，提交阶段会被拒绝（409 VERSION_CONFLICT）。目标不存在时
        它必须为空。

        `.upanel` 是面板的保留目录：它不出现在列目录结果里，任何指向它的路径在形状层
        就被拒绝（422 PATH_OUTSIDE_ROOT）。
      tags: [files]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadCreateRequest'
      responses:
        '201':
          description: 暂存已创建，内容还没收（state=open）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FileUploadData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: root_id 未登记（NOT_FOUND）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            根不可用（ROOT_UNAVAILABLE），或目标当前版本与 expected_version 不一致
            （VERSION_CONFLICT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: |
            声明的 size_bytes 超过单次上传上限（默认 2 GiB，可配置），或根所在文件系统
            在扣掉已预留容量之后放不下（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/uploads/{id}/content:
    put:
      operationId: putFileUploadContent
      summary: 把字节流送进暂存区（仅 admin）
      description: |
        CONTRACTS.md 第 11 节（P06.2 起），权限 admin + CSRF。请求体是**原始字节**
        （application/octet-stream），不是 JSON、不是 multipart：多一层编码就多一次
        把整份内容读进内存的机会。Web 侧不缓存内容，边读边转发给代理；代理边读边写
        暂存文件，同时算摘要。

        必须声明 Content-Length 且它必须等于创建上传时的 size_bytes：不支持分块传输，
        也不支持断点续传。一次只发一半的传输不会变成“一半的文件”，而是 400；
        长度不符的上传在入口就被拒绝，不让它先传 2 GiB 再失败。

        收完之后 state=received，**目标路径仍然一个字节都没变**。落地要
        file.commit_upload；在那之前放弃这次上传（DELETE）不会影响任何文件。
      tags: [files]
      security:
        - upanelSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FilesUploadID'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 内容已收完（state=received），字节数与声明一致。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FileUploadData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: |
            upload_id 形状不合法、缺少 Content-Length、Content-Length 与声明的
            size_bytes 不一致（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 没有这个上传（不存在、已过期、已提交）：NOT_FOUND。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            上传状态不允许接收内容（已 received 或已 failed），或实收字节数与声明不符
            （VERSION_CONFLICT）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 写入过程中空间不足（VALIDATION_ERROR）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

