          type: string
        collected_at:
          $ref: '#/components/schemas/Rfc3339Utc'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AppDiscoverySource'
        candidates:
          type: array
          maxItems: 500
          description: 没有候选时是空数组，不是 null。
          items:
            $ref: '#/components/schemas/AppDiscoveryCandidate'
        missing_bindings:
          type: array
          description: 没有失效绑定（或本机根本没有应用）时是空数组，不是 null。
          items:
            $ref: '#/components/schemas/AppBindingIssue'
        truncated:
          type: boolean
          description: 候选超过 500 个时为 true（只列了前 500 个）。

    AppHealthState:
      type: object
      additionalProperties: false
      description: |
        一次健康探测的结论（或“还没有结论”的说明）。字段集合固定，缺的是 null 而不是
        整个键没了。

        `target_id` / `scheme` / `port` / `path` 在**有结论时**是上次实际探测用的值：
        如果之后有人改了定义，这里显示的仍是历史事实，定义在 `app.health_check` 里。
      required:
        - app_id
        - enabled
        - http_state
        - checked_at
        - status_code
        - duration_ms
        - target_id
        - scheme
        - port
        - path
        - address
        - url
        - last_error
        - expected_status_codes
        - note
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9a-f]{32}$'
        enabled:
          type: boolean
        http_state:
          type: string
          enum: [ok, error, unknown, not_applicable]
        checked_at:
          type: [string, 'null']
          format: date-time
          description: 最近一次探测时间；没启用或从没探过是 null。
        status_code:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
          description: 拿到的状态码；没拿到（连不上、超时、没发出去）是 null，不是 0。
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        target_id:
          type: string
          description: 上次实际探测用的目标标识；从没探过时是定义里的值。
        scheme:
          type: string
          enum: [http, https]
        port:
          type: integer
          minimum: 0
          maximum: 65535
        path:
          type: string
        address:
          type: [string, 'null']
          description: 实际请求的地址（恒为 127.0.0.1）；没有发出请求时是 null。
        url:
          type: [string, 'null']
          description: 实际请求的完整地址；没有发出请求时是 null。
        last_error:
          type: string
          description: 失败或没有结论的原因；成功时为空串。
        expected_status_codes:
          type: array
          maxItems: 8
          description: 定义里的期望集合；空数组表示默认 200—399（不会是 null）。
          items:
            type: integer
            minimum: 100
            maximum: 599
        note:
          type: string
          description: 为什么现在是这个状态（尤其是 unknown 的三种来由）。

    AppCapabilities:
      type: object
      additionalProperties: false
      description: |
        此刻真的能做到的动作，取自底层对象的能力而不是应用类型：systemd 应用来自该
        单元的 `capabilities`，docker 应用来自该容器的 `capabilities`。`link` 与应用
        类型 `compose` 在 P09.4 仍全为 false（前者没有运行时，后者部署能力要到 1.0）。

        前端据此隐藏按钮，而不是先渲染再让点击失败。`logs` 与三项生命周期能力分开
        判定：读日志不是写操作，受保护的单元与判定为高风险的容器都允许读日志。
      required: [open, start, stop, restart, logs]
      properties:
        open:
          type: boolean
          description: 有 public_url 时为真（浏览器能打开入口）。
        start:
          type: boolean
          description: 该单元/容器此刻允许启动（受保护单元、高风险容器为 false）。
        stop:
          type: boolean
        restart:
          type: boolean
        logs:
          type: boolean
          description: 能读到日志（绑定对象找不到或单元文件读不出来时为 false）。

    App:
      type: object
      additionalProperties: false
      description: |
        应用元数据与摘要（AppDefinition + AppSummary）。

        `runtime_state` / `capabilities` / `dependency_protection` 都是观测结果，不是
        类型的属性：P09.4 之前它们分别是 `unknown` / 全 false / `unmanaged`，现在按
        绑定的单元或容器此刻的状态计算。`runtime_note` 与 `dependency_protection_note`
        说明“为什么是这个值”，`null` 表示没有话要说。

        `http_state` / `last_checked_at` 只在启用健康检查后才有结论：没探测过就说
        不知道，不猜一个 `ok` 让首页好看。

        `public_url` 是给浏览器用的入口地址；健康检查的 `target_id` 是给面板自己用的
        探测目标。两者刻意分开：入口可能是反代后的域名，探测必须走本机或容器内部。
      required:
        - id
        - name
        - description
        - icon_key
        - group_id
        - type
        - binding
        - public_url
        - health_check
        - volume_dependencies
        - favorite
        - version
        - created_at
        - updated_at
        - runtime_state
        - runtime_note
        - http_state
        - last_checked_at
        - dependency_protection
        - dependency_protection_note
        - capabilities
      properties:
        id:
          type: string
          pattern: '^app_[0-9a-f]{32}$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        icon_key:
          type: string
          description: 内置图标键（app、globe、database、docker、terminal、files、media、monitor、network、shield、tools）之一，或空字符串。
        group_id:
          type: [string, 'null']
          pattern: '^grp_[0-9a-f]{32}$'
        type:
          $ref: '#/components/schemas/AppType'
        binding:
          $ref: '#/components/schemas/AppBinding'
        public_url:
          type: [string, 'null']
          maxLength: 2048
          description: 只允许 http/https，禁止 javascript/data/file 等协议，不含用户名密码；生产模式下回环地址被拒。
        health_check:
          $ref: '#/components/schemas/AppHealthCheck'
        volume_dependencies:
          type: array
          maxItems: 32
          items:
            type: string
            pattern: '^vol_[0-9a-f]{32}$'
        favorite:
          type: boolean
          description: 当前登录用户是否收藏了它。
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        runtime_state:
          type: string
          enum: [running, stopped, failed, unknown, not_applicable]
          description: |
            link 恒为 not_applicable；compose 恒为 unknown（部署能力 1.0 才有）。
            systemd 按单元的 active_state、docker 按容器的 state 映射，过渡态与读不到
            都是 unknown。docker 侧不会出现 failed：判据是退出码，容器 DTO 里没有它，
            崩退的容器显示为 stopped，原始状态串在 /containers/{id} 的 state_text。
        runtime_note:
          type: [string, 'null']
          description: |
            为什么是现在这个 runtime_state，尤其 unknown 的来由（这一轮没读到 / 对象
            不在本机列表里 / 过渡态 / compose 未落地）。null 表示没有话要说。
        http_state:
          type: string
          enum: [ok, error, unknown, not_applicable]
          description: 未启用健康检查时为 not_applicable，启用但没探测过为 unknown。
        last_checked_at:
          type: [string, 'null']
          format: date-time
          description: 最后一次实际探测时间；从没探测过就是 null。
        dependency_protection:
          type: string
          enum: [managed, unmanaged, not_applicable]
          description: |
            依赖卷的接管状态。link 或没有依赖卷时是 not_applicable。

            managed 的含义被刻意限死：**面板是受管理启动路径上唯一的自动启动者，而且
            那条路径上有实测的依赖卷门禁**。目前只有一种情形成立——docker 容器的
            restart_policy 是 no 或空（Docker 默认，容器不会自己启动）。它不声称能
            阻止管理员在 shell 里手工 docker start。

            systemd 应用一律 unmanaged：P09.4 不改写单元文件，enabled 的单元开机会被
            systemd 直接拉起，被别的单元拉起时同样不经过面板。restart_policy 是
            always/unless-stopped/on-failure 的容器同样 unmanaged。判断不了（状态这一
            轮没读到）时也是 unmanaged——不能写成 managed。
        dependency_protection_note:
          type: [string, 'null']
          description: |
            绕开面板的那条自动启动路径具体是什么（开机、崩溃重启、被别的单元拉起）。
            null 表示没有话要说（not_applicable 时）。
        capabilities:
          $ref: '#/components/schemas/AppCapabilities'

    AppJournalLogsData:
