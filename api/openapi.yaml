                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchProxy
      summary: 修改代理站点（仅 admin）
      description: |
        `version` 必填，与库中不一致返回 409 VERSION_CONFLICT。

        字段缺席表示“不改这一项”，`allowed_cidrs: []` 表示“清空”。只改域名时才重新
        判断冲突（并且排除自己），只改 app_id 时才重新确认应用存在——改一个超时不该
        因为代理临时不可用而失败。
      tags: [proxy]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
