      description: |
        CONTRACTS.md 第 10.1 节（P05.1 起），权限 V。经代理的 services.unit 查询**现场读取**，
        不使用列表缓存：列表最多 10 秒旧，而“现在能不能 stop”必须看现在的状态。

        unit 是完整单元名（例如 cron.service），需要 URL 编码。它只作为标识使用：
        不会被拼成路径或命令，也不会被当成命令片段执行。不存在的单元返回 404，
        而不是空对象；单元名不合法返回 400（非法名字不进代理，也不进 systemctl）。
      tags: [services]
      parameters:
        - name: unit
          in: path
          required: true
          description: 完整单元名，例如 cron.service、serial-getty@ttyS0.service。
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]*\.service$'
      responses:
