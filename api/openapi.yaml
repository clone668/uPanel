servers:
  - url: https://127.0.0.1:9443/api/v1
    description: 默认仅绑定回环地址的管理监听，通过 SSH 隧道访问；绑定地址由本机配置决定。
security:
  - upanelSession: []
tags:
  - name: meta
    description: 存活、版本与能力发现
  - name: auth
    description: 会话、再认证与账号
  - name: operations
    description: 预检与任务
  - name: system
    description: 系统与监控
  - name: storage
    description: 设备、分区、卷
  - name: services
    description: systemd 服务单元
  - name: logs
    description: 结构化日志查询与实时流（仅 admin）
  - name: shares
    description: SMB / NFS 共享
  - name: apps
    description: 应用、容器与部署
  - name: containers
    description: 容器、镜像、网络、卷与 compose 部署（仅 admin，只读）
  - name: files
    description: 受管理文件根
  - name: terminal
    description: 受限交互终端（仅 admin，upanel-shell 身份，非 root）
  - name: proxy
    description: 反向代理与证书
  - name: ops
    description: 软件更新、电源、备份、计划任务、网络、告警
  - name: backup
    description: 备份仓库、策略与快照（仅 admin；定义只有代理里那份）
  - name: schedules
    description: 计划任务与受管理脚本（仅 admin；只读镜像，定义只有代理里那份）
  - name: network
    description: 网卡、路由、监听端口与防火墙现状（仅 admin，只读；写路径走 network.apply / firewall.apply）
paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      summary: 最小存活状态
      description: |
        匿名可访问的最小存活检查，用于反向代理与 systemd 探活。
        只说明进程能处理请求，不代表数据库、代理或系统操作可用；
        不返回内部路径、版本或依赖细节（CONTRACTS.md 第 3 节）。
      security: []
      responses:
        '200':
          description: 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                  request_id:
                    $ref: '#/components/schemas/RequestId'
    head:
      operationId: headHealthLive
      summary: 最小存活状态（仅响应头）
      description: 与 GET 相同的状态码与响应头，响应无正文。
      security: []
      responses:
        '200':
          description: 服务可响应，无正文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'

  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: 登录并签发会话
      description: |
        匿名接口，但入口有四道检查：Content-Type: application/json、
        `X-UPanel-Request: 1`、与本地配置精确匹配的 Origin、严格 JSON（拒绝未知字段与尾部内容）。
        Origin 白名单只来自本机配置，不由 Host 或 X-Forwarded-* 推导。

        失败限速按用户名与来源 IP 双维度在进程内计数（默认 5 次 / 15 分钟、20 次 / 15 分钟），
        窗口到期自动恢复，不做永久锁定；被限速时返回 429，details 带 retry_after_seconds。

        成功时通过 Set-Cookie 下发 __Host-upanel_session（HttpOnly、Secure、SameSite=Strict、
        Path=/、无 Domain），响应体返回一次性 csrf_token 与过期时间。
        二次验证在 P14 之前不接受 totp 字段，提交即 VALIDATION_ERROR。
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
        - $ref: '#/components/parameters/RequestOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，已下发会话 Cookie。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: __Host-upanel_session=<随机值>; Path=/; HttpOnly; Secure; SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码不正确（不区分账号是否存在，避免枚举）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: 登录尝试被限速；details.retry_after_seconds 给出建议等待秒数。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: 读取当前会话
      description: |
        返回当前账号、一次新的 csrf_token、会话过期时间与再认证到期时间。
        每次调用都会轮换 CSRF 令牌（服务端只保存哈希），因此前端启动或刷新后
        先调用本接口再发其他写请求。
      tags: [auth]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 当前会话。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: 退出登录
      description: 删除服务端会话并清除 Cookie；退出后同一 Cookie 立即失效。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      responses:
        '200':
          description: 已退出；响应 data 为空对象，并下发清除 Cookie 的 Set-Cookie。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/EmptyData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/reauth:
    post:
      operationId: postAuthReauth
      summary: 密码再认证
      description: |
        敏感操作（账号增删改、改密码）要求在最近一次再认证窗口内执行。
        密码正确则把当前会话的再认证有效期推到 5 分钟后，并在响应里返回新的
        reauth_expires_at；密码错误返回 403 FORBIDDEN，会话本身仍然有效。

        失败尝试与登录共用限速计数（按用户名与来源 IP 双维度），被限速时返回 429，
        details.retry_after_seconds 给出建议等待秒数。仅供 admin 使用；P14 之前提交
        totp 直接返回 VALIDATION_ERROR。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: 再认证通过，会话获得新的再认证窗口。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ReauthData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            非 admin（FORBIDDEN）、CSRF 失败（CSRF_FAILED）或密码不正确（FORBIDDEN）。
            密码错误不会结束会话，也不会获得再认证窗口。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: 再认证尝试被限速；details.retry_after_seconds 给出建议等待秒数。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      operationId: getUsers
      summary: 账号列表（仅 admin）
      description: |
        按用户名升序返回账号，字段为脱敏 DTO：不包含 password_hash、会话、CSRF 或任何
        认证秘密。limit 默认 50、最大 200；cursor 是上一页末条的不透明编码，
        客户端不得解析。next_cursor 为 null 表示没有下一页。
      tags: [auth]
      security:
        - upanelSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 当页账号。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/UserListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postUser
      summary: 创建账号（仅 admin）
      description: |
        初始密码只出现在请求体里：不回显、不入日志、不写审计。用户名大小写不敏感并归一化为
        小写；用户名已被占用返回 422（业务条件不允许），不是 500。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 已创建；返回脱敏后的新账号。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: patchUser
      summary: 修改账号（admin + 再认证）
      description: |
        只能修改 display_name、role、disabled，且每一项都是可选的，至少提供一项。
        必须携带目标的 version：不匹配返回 409 VERSION_CONFLICT；成功后 version 加一。

        两条硬性约束：管理员不能改动自己的角色或启用状态（403 FORBIDDEN，防止自我提权与
        自我锁死）；任何会让系统失去最后一个可用管理员的降级或禁用返回 422。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 修改成功；返回更新后的账号（version 已加一）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            非 admin（FORBIDDEN）、CSRF 失败（CSRF_FAILED）、再认证窗口已过
            （REAUTH_REQUIRED）或试图修改自己的角色/启用状态（FORBIDDEN）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteUser
      summary: 删除账号（admin + 再认证）
      description: |
        必须携带 version：优先取请求体，其次取查询参数（DELETE 带请求体并非所有客户端都支持）。
        不匹配返回 409 VERSION_CONFLICT。删除目标账号的同时其全部会话立即失效。

        不能删除自己（403），也不能删除最后一个可用管理员（422）。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      parameters:
        - name: version
          in: query
          required: false
          description: 目标账号的 version；请求体里也接受同名字段。
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: 已删除；响应 data 为空对象。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/EmptyData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 非 admin、CSRF 失败、再认证窗口已过或试图删除自己。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: postUserPassword
      summary: 重置账号密码（admin + 再认证）
      description: |
        直接设置新密码（不生成临时密码、不要求旧密码）。新密码必须通过同一套口令策略。
        成功后目标账号的全部会话立即失效；若目标就是自己，当前会话也随之失效，
        调用方必须重新登录。响应不回显新密码，也不把它写进审计。
      tags: [auth]
      security:
