openapi: 3.1.0
info:
  title: uPanel API
  version: 0.0.0-p10.1
  summary: uPanel 单机 Web 管理面板的公开 HTTP 契约。
  description: |
    uPanel 管理单台 Ubuntu 服务器。本文件是 CONTRACTS.md 的机器可校验镜像。
    P00 冻结了统一响应信封、错误码、安全方案、公共参数与头；P01.2 起按阶段补充
    已经实现并通过验收的接口。每阶段只补充该阶段真正实现的接口，不得提前写入
    未实现的“已支持”API。

    通用规则（与 CONTRACTS.md 第 1 节一致）：
    - 前缀 /api/v1，JSON 字段统一 snake_case，TypeScript DTO 不隐式转换命名。
    - 时间为 RFC 3339 UTC；空值为 null，不用空字符串或 0 代替 unknown。
    - 字节与其他大计数器为非负十进制字符串，前端不得用 Number 做精确运算。
    - 百分比为 0—100 浮点数；比率带 _per_sec，时延带 _ms，温度带 _celsius。
    - 列表默认 limit=50、最大 200，cursor 不透明；排序稳定。
    - 每个响应带 X-Request-ID，与响应体 request_id 一致。
    - 异步写任务创建成功返回 202，不代表业务操作成功。
  contact:
    name: uPanel 项目
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-upanel-contract-status:
  stage: P10.1
  implemented_paths:
    - get /api/v1/health/live
    - head /api/v1/health/live
    - post /api/v1/auth/login
    - get /api/v1/auth/session
    - post /api/v1/auth/logout
    - post /api/v1/auth/reauth
    - get /api/v1/users
    - post /api/v1/users
    - patch /api/v1/users/{id}
    - delete /api/v1/users/{id}
    - post /api/v1/users/{id}/password
    - get /api/v1/system/summary
    - get /api/v1/storage/topology
    - get /api/v1/storage/devices
    - get /api/v1/storage/devices/{id}
    - get /api/v1/storage/volumes
    - get /api/v1/storage/volumes/{id}
    - get /api/v1/storage/volumes/{id}/blockers
    - post /api/v1/operations/preflight
    - post /api/v1/jobs
    - get /api/v1/jobs
    - get /api/v1/jobs/{id}
    - post /api/v1/jobs/{id}/cancel
    - get /api/v1/jobs/{id}/events
    - get /api/v1/jobs/{id}/logs
    - get /api/v1/services
    - get /api/v1/services/{unit}
    - get /api/v1/processes
    - get /api/v1/logs
    - get /api/v1/logs/stream
    - get /api/v1/files/roots
    - get /api/v1/files/list
    - get /api/v1/files/text
    - get /api/v1/files/download
    - post /api/v1/files/uploads
    - put /api/v1/files/uploads/{id}/content
    - get /api/v1/files/uploads/{id}
    - delete /api/v1/files/uploads/{id}
    - get /api/v1/terminal/sessions
    - post /api/v1/terminal/sessions/{id}/connection-grants
    - get /api/v1/terminal/sessions/{id}/connect
    - delete /api/v1/terminal/sessions/{id}
    - get /api/v1/shares
    - get /api/v1/shares/{id}
    - get /api/v1/shares/{id}/connections
    - get /api/v1/share-accounts
    - post /api/v1/secrets
    - get /api/v1/apps
    - post /api/v1/apps
    - get /api/v1/apps/{id}
    - patch /api/v1/apps/{id}
    - delete /api/v1/apps/{id}
    - put /api/v1/apps/{id}/favorite
    - get /api/v1/app-groups
    - post /api/v1/app-groups
    - patch /api/v1/app-groups/{id}
    - delete /api/v1/app-groups/{id}
    - get /api/v1/apps/discovery
    - get /api/v1/apps/{id}/health
    - get /api/v1/apps/{id}/logs
    - get /api/v1/containers
    - get /api/v1/containers/{id}
    - get /api/v1/containers/{id}/logs
    - get /api/v1/containers/{id}/logs/stream
    - get /api/v1/images
    - get /api/v1/container-networks
    - get /api/v1/container-volumes
    - get /api/v1/deployments
    - get /api/v1/deployments/{id}
    - get /api/v1/proxies
    - post /api/v1/proxies
    - get /api/v1/proxies/nginx
    - get /api/v1/proxies/conflict
    - get /api/v1/proxies/{id}
    - patch /api/v1/proxies/{id}
    - delete /api/v1/proxies/{id}
  note: 只列出已实现并通过验收的接口；未实现模块不出现在 paths 中。
servers:
  - url: https://127.0.0.1:9443/api/v1
    description: 默认仅绑定回环地址的管理监听，通过 SSH 隧道访问；绑定地址由本机配置决定。
security:
  - upanelSession: []
tags:
  - name: meta
    description: 存活、版本与能力发现
  - name: auth
    description: 会话、再认证与账号
  - name: operations
    description: 预检与任务
  - name: system
    description: 系统与监控
  - name: storage
    description: 设备、分区、卷
  - name: services
    description: systemd 服务单元
  - name: logs
    description: 结构化日志查询与实时流（仅 admin）
  - name: shares
    description: SMB / NFS 共享
  - name: apps
    description: 应用、容器与部署
  - name: containers
    description: 容器、镜像、网络、卷与 compose 部署（仅 admin，只读）
  - name: files
    description: 受管理文件根
  - name: terminal
    description: 受限交互终端（仅 admin，upanel-shell 身份，非 root）
  - name: proxy
    description: 反向代理与证书
  - name: ops
    description: 软件更新、电源、备份、计划任务、网络、告警
paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      summary: 最小存活状态
      description: |
        匿名可访问的最小存活检查，用于反向代理与 systemd 探活。
        只说明进程能处理请求，不代表数据库、代理或系统操作可用；
        不返回内部路径、版本或依赖细节（CONTRACTS.md 第 3 节）。
      security: []
      responses:
        '200':
          description: 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                  request_id:
                    $ref: '#/components/schemas/RequestId'
    head:
      operationId: headHealthLive
      summary: 最小存活状态（仅响应头）
      description: 与 GET 相同的状态码与响应头，响应无正文。
      security: []
      responses:
        '200':
          description: 服务可响应，无正文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'

  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: 登录并签发会话
      description: |
        匿名接口，但入口有四道检查：Content-Type: application/json、
        `X-UPanel-Request: 1`、与本地配置精确匹配的 Origin、严格 JSON（拒绝未知字段与尾部内容）。
        Origin 白名单只来自本机配置，不由 Host 或 X-Forwarded-* 推导。

        失败限速按用户名与来源 IP 双维度在进程内计数（默认 5 次 / 15 分钟、20 次 / 15 分钟），
        窗口到期自动恢复，不做永久锁定；被限速时返回 429，details 带 retry_after_seconds。

        成功时通过 Set-Cookie 下发 __Host-upanel_session（HttpOnly、Secure、SameSite=Strict、
        Path=/、无 Domain），响应体返回一次性 csrf_token 与过期时间。
        二次验证在 P14 之前不接受 totp 字段，提交即 VALIDATION_ERROR。
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
        - $ref: '#/components/parameters/RequestOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，已下发会话 Cookie。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: __Host-upanel_session=<随机值>; Path=/; HttpOnly; Secure; SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码不正确（不区分账号是否存在，避免枚举）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: 登录尝试被限速；details.retry_after_seconds 给出建议等待秒数。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: 读取当前会话
      description: |
        返回当前账号、一次新的 csrf_token、会话过期时间与再认证到期时间。
        每次调用都会轮换 CSRF 令牌（服务端只保存哈希），因此前端启动或刷新后
        先调用本接口再发其他写请求。
      tags: [auth]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 当前会话。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: 退出登录
      description: 删除服务端会话并清除 Cookie；退出后同一 Cookie 立即失效。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      responses:
        '200':
          description: 已退出；响应 data 为空对象，并下发清除 Cookie 的 Set-Cookie。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/EmptyData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/reauth:
    post:
      operationId: postAuthReauth
      summary: 密码再认证
      description: |
        敏感操作（账号增删改、改密码）要求在最近一次再认证窗口内执行。
        密码正确则把当前会话的再认证有效期推到 5 分钟后，并在响应里返回新的
        reauth_expires_at；密码错误返回 403 FORBIDDEN，会话本身仍然有效。

        失败尝试与登录共用限速计数（按用户名与来源 IP 双维度），被限速时返回 429，
        details.retry_after_seconds 给出建议等待秒数。仅供 admin 使用；P14 之前提交
        totp 直接返回 VALIDATION_ERROR。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: 再认证通过，会话获得新的再认证窗口。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ReauthData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            非 admin（FORBIDDEN）、CSRF 失败（CSRF_FAILED）或密码不正确（FORBIDDEN）。
            密码错误不会结束会话，也不会获得再认证窗口。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: 再认证尝试被限速；details.retry_after_seconds 给出建议等待秒数。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      operationId: getUsers
      summary: 账号列表（仅 admin）
      description: |
        按用户名升序返回账号，字段为脱敏 DTO：不包含 password_hash、会话、CSRF 或任何
        认证秘密。limit 默认 50、最大 200；cursor 是上一页末条的不透明编码，
        客户端不得解析。next_cursor 为 null 表示没有下一页。
      tags: [auth]
      security:
        - upanelSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 当页账号。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/UserListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postUser
      summary: 创建账号（仅 admin）
      description: |
        初始密码只出现在请求体里：不回显、不入日志、不写审计。用户名大小写不敏感并归一化为
        小写；用户名已被占用返回 422（业务条件不允许），不是 500。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 已创建；返回脱敏后的新账号。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: patchUser
      summary: 修改账号（admin + 再认证）
      description: |
        只能修改 display_name、role、disabled，且每一项都是可选的，至少提供一项。
        必须携带目标的 version：不匹配返回 409 VERSION_CONFLICT；成功后 version 加一。

        两条硬性约束：管理员不能改动自己的角色或启用状态（403 FORBIDDEN，防止自我提权与
        自我锁死）；任何会让系统失去最后一个可用管理员的降级或禁用返回 422。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 修改成功；返回更新后的账号（version 已加一）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            非 admin（FORBIDDEN）、CSRF 失败（CSRF_FAILED）、再认证窗口已过
            （REAUTH_REQUIRED）或试图修改自己的角色/启用状态（FORBIDDEN）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteUser
      summary: 删除账号（admin + 再认证）
      description: |
        必须携带 version：优先取请求体，其次取查询参数（DELETE 带请求体并非所有客户端都支持）。
        不匹配返回 409 VERSION_CONFLICT。删除目标账号的同时其全部会话立即失效。

        不能删除自己（403），也不能删除最后一个可用管理员（422）。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      parameters:
        - name: version
          in: query
          required: false
          description: 目标账号的 version；请求体里也接受同名字段。
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: 已删除；响应 data 为空对象。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/EmptyData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 非 admin、CSRF 失败、再认证窗口已过或试图删除自己。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: postUserPassword
      summary: 重置账号密码（admin + 再认证）
      description: |
        直接设置新密码（不生成临时密码、不要求旧密码）。新密码必须通过同一套口令策略。
        成功后目标账号的全部会话立即失效；若目标就是自己，当前会话也随之失效，
        调用方必须重新登录。响应不回显新密码，也不把它写进审计。
      tags: [auth]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: 密码已更新；返回更新后的账号（version 已加一）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/system/summary:
    get:
      operationId: getSystemSummary
      summary: 系统概况（CPU、内存、负载、网络、主机信息）
      description: |
        返回代理最近一次采集的快照（CONTRACTS.md 第 3 节，权限 V）。

        采集在代理侧按 5 秒轮询 /proc 与 /sys，查询只读快照：同一窗口内反复刷新拿到
        同一份数据与同一个 collected_at，不会因为刷新快慢得到互相矛盾的数。

        这份响应里没有“补零”的数字：
        - 每段有自己的 status（ok / error / unavailable）与 error 说明；
        - 最近一次采集失败的段保留最近一次成功的值，collected_at 停在那次成功的时间，
          界面据此显示“陈旧”，而不是把 0 当成真实值；
        - 首次采样、计数器重置、跨重启时，usage_percent 与 *_bytes_per_second 是 null；
        - stale 只说明快照本身太旧（超过 3 个采集间隔），不代表各段采集成功。

        字节数与计数器是十进制字符串（与第 1 节一致），百分比与速率是数字。
      tags: [system]
      responses:
        '200':
          description: 最近一次采集快照；可能 degraded（部分段失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemSummary'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），此时没有可展示的采集数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/topology:
    get:
      operationId: getStorageTopology
      summary: 块设备拓扑（nodes、edges、snapshot_version）
      description: |
        返回代理最近一次扫描的块设备拓扑（CONTRACTS.md 第 6 节，权限 V）。

        采集全部只读：读 /sys/block、/proc/self/mountinfo、/proc/swaps、/dev/disk/by-*
        与整盘最前面的 34 个扇区（判断分区表类型与空闲区），不执行任何外部命令。
        扫描在代理侧按 5 秒循环进行，查询只读快照：同一窗口内反复刷新拿到同一份拓扑
        与同一个 snapshot_version。

        edges 的 from 是**子设备/消费者**，to 是**父设备/底层提供者**：
        sda1 --partition_of--> sda，dm-0 --depends_on--> sda2。保护与锁沿这个方向递归向上追。

        snapshot_version 只覆盖 nodes 与 edges 的内容，不含容量与采集时间：
        内容不变则版本不变，执行前的幂等与预检比对靠它。

        status 是**最近一次扫描尝试**的结果。扫描失败时 nodes/edges/collected_at 停在上一次
        成功的样子，status=error 并给出 error 原因——读不到 sysfs 不等于服务器上没有磁盘，
        因此失败时不会把节点清空。
      tags: [storage]
      responses:
        '200':
          description: 最近一次扫描快照；可能标记为 error（保留上一次成功的节点）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageTopology'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败），此时没有可展示的拓扑。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/devices:
    get:
      operationId: listStorageDevices
      summary: 块设备列表（含系统盘保护判断）
      description: |
        与 /storage/topology 读同一份快照（CONTRACTS.md 第 6 节，权限 V）。
        因此列表里每一台设备的 protection、holders 与 collected_at 都与拓扑里的完全一致。

        每台设备至少包含 Device 必需字段。P04.2 起另有三个附加字段（见 CONTRACTS.md 第 6 节）：
        protection（系统盘保护与理由）、holders（谁依赖它）、swap（活动交换区）。

        health 在 P04.3 起由 SMART / NVMe 健康日志填充，判定依据见 StorageHealth；
        读不到、盘在休眠或桥接不被支持时是 unknown 或 sleeping，绝不写成 healthy。

        io 在 P04.3 起填充：每台设备只报自己那一行 diskstats 计数，从不相加。

        capabilities 在本阶段恒为空数组：写动作登记表要到 P07 才开始有内容，
        这里不能预告未实现的能力。未知类型的设备更不能暗示可以破坏性操作。
      tags: [storage]
      responses:
        '200':
          description: 设备列表与采集元数据。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/StorageDeviceList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: 代理不可用（未配置 socket 或连接失败）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/devices/{id}:
