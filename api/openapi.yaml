    ProxySite:
      type: object
      additionalProperties: false
      description: |
        一个代理站点（CONTRACTS.md 第 9 节 ProxyDefinition，字段平铺）。

        没有 applied_config_hash、没有 config_path 这类**存下来的**结论：P10.2 真的
        写配置了，但“现在是否已落地”仍然是每次读的时候算出来的（`applied`），不是
        数据库里的一列。库里存一份 `applied=true` 只会多一个会漂移的真相：有人手工
        改了文件、或者把文件删了，那个 true 还写在库里。见 CONTRACTS §9.2(7)。
      required: [id, app_id, domain, upstream_target_id, upstream_scheme, upstream_port,
                 access_mode, allowed_cidrs, basic_auth_users, websocket_enabled,
                 max_body_bytes, read_timeout_seconds, enabled, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^site_[0-9a-f]{32}$'
        app_id:
          type: [string, 'null']
          description: 关联的应用；不关联时为 null。
        domain:
          type: string
          maxLength: 253
          description: 归一化后的域名（小写、无末尾点、IDNA A-label）。不接受通配符。
        upstream_target_id:
          type: string
          description: 上游目标标识（代理发现结果里的 local_/cntr_ 形状）。
        upstream_scheme:
          type: string
          enum: [http, https]
        upstream_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 等于管理面板端口（默认 9443）一律拒绝。
        access_mode:
          type: string
          enum: [public, cidr, basic_auth]
        allowed_cidrs:
          type: array
          description: 仅 cidr 模式使用；已按掩码归一化并排序。没有限制时是 []。
          items:
            type: string
        basic_auth_users:
          type: array
          description: 仅 basic_auth 模式使用。**只有 name，没有 secret_ref。**
          items:
            $ref: '#/components/schemas/ProxyBasicAuthUser'
        websocket_enabled:
          type: boolean
        max_body_bytes:
          type: integer
          minimum: 1024
          maximum: 1073741824
          description: 默认 1048576（与 nginx 默认的 1 MiB 一致）。
        read_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: 默认 60（与 nginx 默认一致）。
        enabled:
          type: boolean
          description: |
            意图，不是事实。它说的是“用户希望这个站点生效”；真正是否已经落在
            Nginx 上要看 `applied`。两者不一致是正常状态（改了记录还没点应用）。
        applied:
          $ref: '#/components/schemas/ProxyAppliedState'
        version:
          type: integer
          minimum: 1
          description: 乐观并发版本，每次成功修改加一；写操作必须回传。
        created_at:
          $ref: '#/components/schemas/Rfc3339Utc'
        updated_at:
          $ref: '#/components/schemas/Rfc3339Utc'

    ProxyAppliedState:
      type: object
      additionalProperties: false
      description: |
        这条记录此刻在 Nginx 上的落地状态。**每次读的时候算出来**：把面板此刻渲染
        这份定义得到的字节，与配置树里那份文件的字节比对（CONTRACTS §9.2(7)）。

        四态闭集，不要合并：
        - `applied`：文件在，内容与渲染结果逐字节相同。
        - `stale`：文件在，但内容不同——被手工改过，或者记录改过还没应用。
        - `not_applied`：该生效却没有文件；或者已停用且文件确实不在了。
        - `unknown`：读不到 Nginx 现状，或这份定义渲染不出来。`reason` 说明是哪一种。

        `stale` 与 `not_applied` 分开的原因是下一步动作不同：前者要替换一份旧的，
        后者只是缺一步。
      required: [state]
      properties:
        state:
          type: string
          enum: [applied, stale, not_applied, unknown]
        config_file:
          type: string
          description: 托管配置文件的绝对路径；算不出来时是空串。
        config_hash:
          type: string
          description: 此刻渲染结果的 sha256（十六进制）。不出现表示这份定义渲染不出来。
        reason:
          type: string
          description: 给人看的一句话；`unknown` 时一定有。

    ProxyBasicAuthUser:
      type: object
      additionalProperties: false
      description: |
        basic auth 用户。响应里只有 name：secret_ref 也不靠“读出来再存回去”维持，
        因此修改用户列表时必须重新提供 secret_ref（请求侧字段见 ProxyDefinitionCreate）。
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'

    ProxyNginxState:
      type: object
      additionalProperties: false
      description: |
        主机 Nginx 现状摘要。`read_error` 非空表示面板读不到代理：那时 `available`
        与 `config_missing` 都不可信，界面必须显示“不知道”，不能显示“没有 Nginx”。
      required: [available, config_missing, reason, version, unit_state, config_root,
                 collected_at, managed_file_count, broken_files, warnings, read_error]
      properties:
        available:
          type: boolean
        config_missing:
          type: boolean
          description: 配置目录根本不存在：这台机器大概率没装 Nginx（因此确认没有冲突）。
        reason:
          type: string
          description: 给人看的一句话说明。
        version:
          type: string
          description: nginx -v 报的版本号；读不到是空串，不编。
        unit_state:
          type: string
          description: nginx.service 的 ActiveState；空串表示没读到，不是“没在跑”。
        config_root:
          type: string
        collected_at:
          type: [string, 'null']
          description: 采集时刻；读不到代理时为 null。
        managed_file_count:
          type: integer
          minimum: 0
          description: 面板自己的配置文件（upanel-*.conf）数量。
        broken_files:
          type: array
          description: 解析失败的文件。它们里面写了什么不知道，因此冲突结论只能是 unknown。
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        read_error:
          type: string
          description: 空串表示读到了；`agent_unavailable` / `no_agent_connection` 表示读不到。

    ProxyServer:
      type: object
      additionalProperties: false
      description: 一个 server 块。names 与 listen 都是文件里的原文，不做归一化。
      required: [line, names_line, names, listen]
      properties:
        line:
          type: integer
          minimum: 1
          description: server 这个字所在的行。
        names_line:
          type: integer
          minimum: 0
          description: 第一条 server_name 所在的行；没有 server_name 时为 0。
        names:
          type: array
          items:
            type: string
        listen:
          type: array
          items:
            type: string

    ProxyConfigFile:
      type: object
      additionalProperties: false
      required: [path, managed, size_bytes, error, servers]
      properties:
        path:
          type: string
        managed:
          type: boolean
          description: 面板自己的文件（upanel-*.conf）。
        size_bytes:
          type: integer
          minimum: 0
        error:
          type: string
          description: 解析或读取失败的原因；空串表示读到了。
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ProxyServer'

    ProxyNginxFacts:
      type: object
      additionalProperties: false
      required: [state, files, server_names, includes]
      properties:
        state:
          $ref: '#/components/schemas/ProxyNginxState'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ProxyConfigFile'
        server_names:
          type: array
          description: 归一化后的 host 列表（去重升序）。
          items:
            type: string
        includes:
          type: array
          description: 配置里出现、但面板没有跟随的 include 目标。
          items:
            type: string

    ProxyConflictHit:
      type: object
      additionalProperties: false
      required: [file, line, name, managed]
      properties:
        file:
          type: string
        line:
          type: integer
          minimum: 1
        name:
          type: string
          description: 文件里原本写的 server_name 原文。
        managed:
          type: boolean

    ProxyDomainConflict:
      type: object
      additionalProperties: false
      required: [domain, state, reason, matches, undecidable, broken_files, existing_site_id, nginx]
      properties:
        domain:
          type: string
        state:
          type: string
          enum: [clear, taken, unknown]
          description: |
            clear 可以写；taken 已被占用；unknown 判不了——unknown **不是** clear，
            写入会被拒绝。
        reason:
          type: string
        matches:
          type: array
          items:
            $ref: '#/components/schemas/ProxyConflictHit'
        undecidable:
          type: array
          description: 写法判不了、可能占住这个域名的声明（例如正则 server_name）。
          items:
            $ref: '#/components/schemas/ProxyConflictHit'
        broken_files:
          type: array
          items:
            type: string
        existing_site_id:
          type: [string, 'null']
          description: 面板自己已有的同域名记录（修改自己时不算冲突）。
        nginx:
          $ref: '#/components/schemas/ProxyNginxState'

    ProxySiteListData:
      type: object
      additionalProperties: false
      required: [items, next_cursor, nginx]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProxySite'
        next_cursor:
          type: [string, 'null']
        nginx:
          $ref: '#/components/schemas/ProxyNginxState'

    ProxyDefinitionCreate:
      type: object
      additionalProperties: false
      description: 新建站点的请求体（CONTRACTS.md 第 9 节 ProxyDefinition）。
      required: [domain, upstream_target_id, upstream_port]
      properties:
        app_id:
          type: [string, 'null']
          pattern: '^app_[0-9a-f]{32}$'
          description: 关联的应用；不提供或 null 表示不关联。
        domain:
          type: string
          maxLength: 253
          description: 不带协议/路径/端口的域名；不接受通配符。
        upstream_target_id:
          type: string
        upstream_scheme:
          type: string
          enum: [http, https]
          description: 省略时为 http。
        upstream_port:
          type: integer
          minimum: 1
          maximum: 65535
        access_mode:
          type: string
          enum: [public, cidr, basic_auth]
          description: 省略时为 public。
        allowed_cidrs:
          type: array
          description: access_mode=cidr 时必填；其他模式下给出非空列表是错误，不是“顺手存下”。
          items:
            type: string
        basic_auth_users:
          type: array
          description: access_mode=basic_auth 时必填；同名用户是错误（两条同名 htpasswd 只有一条有效）。
          items:
            $ref: '#/components/schemas/ProxyBasicAuthUserInput'
        websocket_enabled:
          type: boolean
        max_body_bytes:
          type: integer
          minimum: 1024
          maximum: 1073741824
          description: 省略或 0 时取默认 1048576。
        read_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: 省略或 0 时取默认 60。
        enabled:
          type: boolean
          description: 省略时默认启用（“省略”和“显式 false”是两件事）。

    ProxyBasicAuthUserInput:
      type: object
      additionalProperties: false
      required: [name, secret_ref]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        secret_ref:
          type: string
          pattern: '^sec_[0-9a-f]{32}$'
          description: 通过 POST /secrets（用途 proxy_basic_password）取得。只在请求里出现。

    ProxyDefinitionPatch:
      type: object
      additionalProperties: false
      description: 修改站点的请求体：字段缺席表示不改这一项。
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        app_id:
          type: [string, 'null']
          pattern: '^app_[0-9a-f]{32}$'
          description: 显式 null 或空串表示解除关联。
        domain:
          type: string
          maxLength: 253
        upstream_target_id:
          type: string
        upstream_scheme:
          type: string
          enum: [http, https]
        upstream_port:
          type: integer
          minimum: 1
          maximum: 65535
        access_mode:
          type: string
          enum: [public, cidr, basic_auth]
        allowed_cidrs:
          type: array
          description: 提供 [] 表示清空这个列表；字段缺席表示不动它。
          items:
            type: string
        basic_auth_users:
          type: array
          description: 提供 [] 表示清空；修改时必须重新给出 secret_ref（响应里没有它）。
          items:
            $ref: '#/components/schemas/ProxyBasicAuthUserInput'
        websocket_enabled:
          type: boolean
        max_body_bytes:
          type: integer
          minimum: 1024
          maximum: 1073741824
        read_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        enabled:
          type: boolean
  responses:
    BadRequest:
      description: 语法或参数错误（400）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: 未登录或会话失效（401）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足、缺少 CSRF 或再认证不足（403）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 目标不存在（404）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 冲突、忙或预检失效（409）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 超过大小限制（413）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: 参数合法但业务条件不允许（422）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 触发限速（429）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: 功能尚未实现（501）。未实现模块必须隐藏或显示 NOT_IMPLEMENTED，不得返回伪成功。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 代理或依赖不可用（503）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
