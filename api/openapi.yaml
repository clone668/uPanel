        `app_ids` 回 400（那一列在这条策略里不会被执行，留着只会让人以为会停），
        `stop_managed_apps` 不带 `app_ids` 同样回 400（不说停谁就等于说"随便停"）。

        执行（`backup.run`）与清理（`backup.prune`）都不在这里：那是预检 → 任务，执行前
