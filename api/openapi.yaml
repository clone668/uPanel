  /api/v1/apps/{id}/health:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: getAppHealth
      summary: 一次应用的健康探测结论（登录可读）
      description: |
        CONTRACTS.md 第 8.2 节（P09.2）。返回最近一次探测的结论，只读——探测由 Web
        进程里的调度器按 `interval_seconds` 触发，代理执行，结果落在 `app_health_results`。

        权限 V：它只说明“这个入口通不通”，不含侦察材料（本机端口、容器列表在
        `/apps/discovery`，那里是 admin）。

        `http_state` 的四种取值对应三件不同的事：`not_applicable`（没启用健康检查）、
        `unknown` + `checked_at: null`（启用了但从没探过）、`unknown` + `checked_at`
        非空（探过但没得出结论，原因见 `last_error`）、`error`/`ok`（拿到了结论）。
        `note` 把这几件事说成人话。

        `address` / `url` 只在**真的发出过请求**时非空：代理不可用那一轮写的是
        `unknown`，地址留空，而不是填一个 127.0.0.1 让人以为探测过。
      tags: [apps]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 最近一次探测结论（或“还没探过”的说明）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AppHealthState'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: getAppLogs
      summary: 应用所绑定对象的日志（仅 admin）
      description: |
        CONTRACTS.md 第 8.4 节（P09.4）。按应用的**绑定**判别来源：systemd 应用读
        journal（与 `/logs` 同一条读取链），docker 应用读容器日志（与
        `/containers/{id}/logs` 同一条链）。它不产生新的读取能力，价值在于页面拿着
        一个应用标识就能看到背后那个东西的日志。

        **对象来自绑定，不来自请求。** `unit`、`source` 一律 400：否则这个接口就是
        “按任意单元名读日志”的通用入口，绕过 `/logs` 自己的边界。两个来源的参数集合
        也不互相串味——journal 只收 `level`/`from`/`to`/`cursor`/`limit`，docker 只收
        `since`/`until`/`tail`/`cursor`；传错集合得到 400，而不是被静默忽略。

        权限 admin：日志里什么都可能有（口令形态的字符串、内网地址）。

        状态码：`link` → 422（没有运行时就没有日志）；`compose` → 501（部署能力 1.0
        才有，不返回空 page 冒充成功）；绑定的容器已不存在 → 404 `CONTAINER_NOT_FOUND`
        （原样带出代理的判决，页面据此要求重新确认绑定）；代理不可用 → 503。
      tags: [apps]
      security:
        - upanelSession: []
      parameters:
        - name: level
          in: query
          required: false
          description: 仅 journal。级别下限。
          schema:
            type: string
            enum: [emergency, alert, critical, error, warning, notice, info, debug]
        - name: from
          in: query
          required: false
          description: 仅 journal。窗口起点（含）。
          schema:
            $ref: '#/components/schemas/Rfc3339Utc'
        - name: to
          in: query
          required: false
          description: 仅 journal。窗口终点（含）。
          schema:
            $ref: '#/components/schemas/Rfc3339Utc'
        - name: since
          in: query
          required: false
          description: 仅 docker。相对时长（例如 10m）或 RFC 3339 时间。
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: 仅 docker。窗口终点，形状同 since。
          schema:
            type: string
        - name: tail
          in: query
          required: false
          description: 仅 docker。最多读多少行，1—1000；不传时用默认值。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          required: false
          description: 向更早翻页的游标；形状由来源决定，不透明。
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页日志；`source` 判别 `page` 的形状。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AppJournalLogsData'
                      - $ref: '#/components/schemas/AppContainerLogsData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

