        CONTRACTS.md 第 8.3 节、PLAN.md 第 12 节：0.1 不创建、不更新 compose 项目，
        **不执行任何外部 Compose YAML**。这里的项目是从容器的
        com.docker.compose.* 标签归并出来的观测结果，capabilities 三项固定为 false。

        id 由项目名派生（dep_ + sha256 前 32 位十六进制），因此在项目被整体删除后
