        VERSION_CONFLICT——两个人同时改一条记录时，后到的那个必须知道自己改的是旧值。

        `group_id` 用“显式 null 表示移出分组”，与“没提供这个字段”是两件事。

        改 `type` 必须同时给出 `binding`：只改类型会留下一条“类型说 docker、绑定是
