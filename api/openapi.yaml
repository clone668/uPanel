  /api/v1/deployments/managed:
    get:
      operationId: listManagedDeployments
      summary: 面板管理的 Compose 部署清单（只读，仅 admin）
      description: |
        CONTRACTS.md 第 8.9 节（P15.4）。这是**管理面**，与 `/api/v1/deployments`
        （观测面）回答的不是同一个问题：

        - `/api/v1/deployments` 读 docker：这台机器上跑着什么 compose 项目，
          里面混着别人手工 `docker compose up` 起的、面板不知道也管不了的项目；
        - `/api/v1/deployments/managed` 读 `/etc/upanel/deploy` 下的三个文件与
          systemd 的两个回答：面板管着哪些部署，它们现在是什么状态。

        两张表按 `deployment_id` 连接（与 compose 项目标识同一个值：`dep_` +
        部署名的 sha256 前缀）。混成一张表就会有一边读错：拿项目清单当"我的部署"，
        手工起的项目会变成一条点不动的部署；拿部署配置当"机器上跑着什么"，
        配置被删掉但容器还在跑的项目会凭空消失。

        **这份读数是现场，不是承诺**：`record.image.digest` 是上一次执行
        （apply/update）读回并写下的镜像指纹，不是这一次现问 docker 的。
        `unit_state` 是这一次现问 systemd 的。两者混在一起读会把"上次跑的是
        哪个镜像"当成"现在跑的是哪个镜像"——真要核对容器，读 `/api/v1/containers`。

        `skipped[]` 是配置目录里存在但没能读成部署的条目。它非空说明这台机器上
        有东西面板不知道，页面必须显示出来，而不是静默略过。
      tags: [containers]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 部署现场清单。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedDeploymentListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 代理不可用（未配置代理连接，或代理连不上）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/managed/{name}:
    get:
      operationId: getManagedDeployment
      summary: 单个面板管理的部署现场（只读，仅 admin）
      description: |
        CONTRACTS.md 第 8.9 节（P15.4）。带上完整记录（规范化定义 + 镜像记录 +
        上一版），创建/更新/删除的表单用的就是这一份定义。

        定义是**闭集**：`privileged`、`devices`、`network_mode`、`cap_add`、
        `compose_yaml` 这类选项在数据模型里没有位置，因此既写不进去，也读不出来。
        挂载只能由"文件根 id + 根内相对路径"表达，宿主绝对路径、`..`、`/proc`、
        `/sys`、`/dev`、`docker.sock` 一律在预检里被拒绝。

        没有这份部署时是 404——不是 200 + 空结构：空结构会被界面读成
        "有这份部署，但它什么都没有"。
      tags: [containers]
      security:
        - upanelSession: []
      parameters:
        - name: name
          in: path
          required: true
          description: 部署名（等长限制与 Compose 项目名一致）。
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,62}$'
      responses:
        '200':
          description: 部署现场。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedDeployment'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          description: 部署名不符合规则。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 没有这个部署（配置、单元与记录三者都不在）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 代理不可用。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/packages:
    get:
      operationId: listPackages
      summary: 已安装包与候选版本（仅 admin）
      description: |
        CONTRACTS.md 第 12.1 节（P11.1 起）。事实来自代理的两条源命令（`dpkg-query` 与
        `apt-cache policy`），`upgradable` / `candidate_relation` / `security` / `pockets`
        由面板判定。

        `upgradable` 的含义是**候选版本比已安装的新**，不是"这一次会被升级"：分阶段推送
        （phased）与被保留（held back）的包要 `apt-get -s upgrade` 才判得出，那是 P11.2。
        因此这里不承诺 `upgradable=true` 的包在升级时会全部被升级。

        `errors[]` 非空表示降级读取：典型是 `apt-cache` 不可用，此时包列表照出，
        每个包的 `candidate_relation` 是 `unknown`，而不是拿已安装版本冒充候选版本。
      tags: [system]
      security:
        - upanelSession: []
      parameters:
        - name: query
          in: query
          required: false
          description: 包名子串匹配（大小写不敏感）；只允许可打印 ASCII，长度 ≤ 100。
          schema:
            type: string
            maxLength: 100
        - name: installed
          in: query
          required: false
          description: 只看已安装（默认 true）。false 表示把仅有配置残留（`rc`）的包也算进来。
          schema:
            type: boolean
            default: true
        - name: upgradable
          in: query
          required: false
          description: 只看候选版本比已安装新的包。
          schema:
            type: boolean
            default: false
        - name: security
          in: query
          required: false
          description: 只看候选版本来自 `-security` 源的包（隐含 upgradable=true）。
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 包列表与计数。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/PackageList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/packages/updates:
    get:
      operationId: listPackageUpdates
      summary: 可升级清单（仅 admin）
      description: |
        CONTRACTS.md 第 12.1 节（P11.1 起）。安全更新排在前面，其余按包名升序。

        不分页但一次最多 1000 条；超过时 `truncated=true`，并且不把"没列出的部分"
        算进 `total` 之外的地方——`total` 始终是全量。

        `reboot_required` 不在这里：重启标志是 `GET /system/power-state` 的字段。
        这两个事实来源不同（一个来自 APT 缓存，一个来自包自己写的文件），
        塞进同一个响应会让"升级之后要不要重启"看起来是一次查询的结论。
      tags: [system]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 可升级清单。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/PackageUpdates'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/system/power-state:
    get:
      operationId: getPowerState
      summary: 重启标志与本 boot_id（仅 admin）
      description: |
        CONTRACTS.md 第 12.1 节（P11.1 起）。只读：`reboot_required` 是
        `/run/reboot-required` 在不在，`reboot_required_packages` 是该文件旁边
        `.pkgs` 的原文内容，`reboot_required_since` 是主文件的 mtime。

        面板**不自己推断**"装了内核所以要重启"：那是包自己的 postinst 写的文件，
        我们只报告它。`boot_id` 是重启任务的确认依据（P11.3）：同一个值说明没重启。

        重启/关机本身不在这里，是 `system.power`（预检 → 任务）。那个动作的结果只有
        accepted，所以任务详情里另有一节 `power_check`，用 boot_id 的变化回答
        "它到底发生了没有"。
      tags: [system]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 重启标志与 boot_id。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/PowerState'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: 这台机器上装了哪些外部程序与版本（仅 admin）
      description: |
        CONTRACTS.md 第 8.10 节（P16.1 起）。只读。

        回答的是"这台机器能做什么"：备份页要 restic、部署页要 docker、代理页要 nginx、
        防火墙页要 ufw，缺任何一个时界面此前只能显示"读了但没读到"，真正的原因只有
        SSH 进去才知道。这一条把原因摆出来。

        数据来自代理的**缓存快照**，不在请求里现场探测：这个端点会被页面反复刷新，
        让每次刷新都等十几条版本命令是不合适的。代理启动时探一次，之后每 10 分钟重探。

        三条不许混的语义：

        - `ready=false` 时 `host_caps` 必定是 `null`——那是"代理还没探完"，
          **不是**"这台机器没有依赖"。前端必须画"还没探完"，不能画空表。
        - 条目的 `state` 是三态：`present` / `absent` / `unknown`。`unknown` 表示
          固定目录读不出来，既不能说有也不能说没有；把它并进 `absent` 会让人
          按提示重装一遍已经装好的东西。
        - 这只是转述，不是准入：某个动作能不能做，仍然由那个动作自己的预检回答。

        程序只在 `/usr/sbin`、`/sbin`、`/usr/bin`、`/bin` 四个固定目录里找，不走 `PATH`
        （PATH 里可能有可写目录）。版本只在命令真的跑完并匹配到锚点时才填。

        权限是 admin：这份清单合起来就是主机指纹（与容器清单、部署定义同一个判断）。
      tags: [system]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 能力快照；代理还没探完时 `host_caps` 为 null。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/SystemCapabilities'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/network/interfaces:
    get:
      operationId: listNetworkInterfaces
      summary: 网卡、地址与"能不能改"的判定（仅 admin）
      description: |
        CONTRACTS.md 第 14.1 节（P14.1 起）。只读。

        数据来自两处：`ip -j addr show`（地址、operstate、master）与
        `/sys/class/net/<name>/`（MTU、MAC、载波、是不是物理设备、类型）。两处互相
        印证，但任一处读不到都只记一条 `issues`，其余照常给出——一份空网卡列表会被
        读成"这台机器没有网卡"。

        `capability` 回答"P14.2 的括号能不能打开"：只有 netplan 配置 + systemd-networkd
        渲染、且只有唯一一张物理以太网卡、没有网桥/bond/VLAN/Wi-Fi、NetworkManager 没在跑
        的时候才 `editable=true`。判定依据是 `/etc/netplan` 下有没有配置、`/run` 下有没有
        渲染产物，以及运行时网卡的类型——不解析 netplan 的 YAML，也不靠名字猜。

        **没有写入口**：改地址是 `network.apply` 的预检 → 任务。
      tags: [network]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 网卡列表与可改判定。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkInterfaceList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/network/routes:
    get:
      operationId: listNetworkRoutes
      summary: 路由表与默认网关（仅 admin）
      description: |
        CONTRACTS.md 第 14.1 节（P14.1 起）。只读。

        IPv4 与 IPv6 各查一次（`ip -j route show` 与 `ip -j -6 route show`）：只查 v4
        会漏掉 v6 默认网关，而"这台机器从哪儿出去"必须两个家族都答。默认路由排在最前，
        顺序在代码里固定，不依赖 `ip` 的输出顺序。

        `gateways` 是去重后的默认下一跳，按家族分开。`metric` 与 `pref_set` 成对出现
        ——0 是合法优先级，"没有 metric"不能拿 0 表示。
      tags: [network]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 路由表与默认网关。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkRouteList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/network/listeners:
    get:
      operationId: listNetworkListeners
      summary: 监听端口与占用进程（仅 admin）
      description: |
        CONTRACTS.md 第 14.1 节（P14.1 起）。只读。

        数据来自 `/proc/net/{tcp,tcp6,udp,udp6}`：只取 LISTEN（TCP 状态 `0A`）与
        UDP 的 `07`，所以表里只有"对外开着的口"，不含已建立的连接。进程归属由
        `/proc/<pid>/fd` 里的 `socket:[inode]` 反查得到；反查不到时 `pid=0`——
        那是"读不到"，不是"没有进程"。

        `truncated=true` 表示结果被上限截断（监听表可能有几千条）。页面必须说明
        "这不是全部"，不能装作完整。
      tags: [network]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 监听端口列表。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkListenerList'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/network/config:
    get:
      operationId: getNetworkConfig
      summary: 可改网卡的生效配置、config_hash 与待确认的回滚（仅 admin）
      description: |
        CONTRACTS.md 第 13.6 节（P14.2 起）。只读：读 netplan 目录、`/run` 下的渲染产物
        与内核地址，一个字节都不改。

        它回答三件页面必须知道的事：

        1. **能不能改**：`capability.editable` 与 `capability.reasons`，判定在代理侧
           （要读 `/run/systemd/network/` 的渲染产物与 sysfs），Web 不改写、不补充。
        2. **提交时该带什么指纹**：`config_hash`。它**只在 `editable=true` 时出现**——
           算不出来就别给一个"看起来能提交"的值，那种值只会让提交永远得到
           `NETWORK_CONFIG_CHANGED`。
        3. **有没有一条还没确认的回滚**：`pending`，带 `seconds_left` 与 `deadline`。
           它不为 null 时，`network.apply` 的预检会被判 `NETWORK_ROLLBACK_PENDING`：
           先确认或先回滚，不许叠加。

        改本身走 `network.apply` 的预检 → 任务。`network.confirm` 的参数里有一个字段
        不归调用方：`arrived_on` 由服务端从这条连接的本地地址取（`http.LocalAddrContextKey`），
        请求体里出现它会得到 400 `VALIDATION_ERROR`；取不到地址时这一次确认直接失败
        （120 秒后自动回滚到原配置），而不是在没有凭据的情况下把新配置永久留下。

        未接线（`-network-writes` 未打开）时回 503 `AGENT_UNAVAILABLE`，**不给一份看起来
        能用的空配置**。
      tags: [network]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 写路径的入口状态。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkConfigState'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/firewall/config:
    get:
      operationId: getFirewallConfig
      summary: 面板管理的防火墙规则、config_hash 与待确认的回滚（仅 admin）
      description: |
        CONTRACTS.md 第 13.7 节（P14.3 起）。只读：跑 `ufw status` 与 `ufw show added`，
        一个规则都不改。

        它回答三件页面必须知道的事：

        1. **能不能改**：`editable`，判定在代理侧（要 UFW 独占、装好、且判据能读全），
           Web 不改写、不补充。不能改时 `reasons` 说明为什么。
        2. **提交时该带什么指纹**：`config_hash`。它**只在 `editable=true` 时出现**。
        3. **有没有一条还没确认的回滚**：`pending`，带 `seconds_left` 与 `deadline`，
           以及 `previous`（"退回去会变成什么样"）。它不为 null 时，`firewall.apply`
           的预检会被判 `FIREWALL_ROLLBACK_PENDING`：先确认或先回滚，不许叠加。

        `rules` **只列面板管理的规则**（带 `upanel:` 标记的那些）。管理员手写的规则不出现
        在这里，因为面板不会去动它们——把它们混进"可以编辑的列表"，下一步就会有人以为
        删掉一行只是删掉一个显示项。手写规则仍然在 `GET /api/v1/firewall` 里完整可见。

        未接线（`-firewall-writes` 未打开）时回 503 `AGENT_UNAVAILABLE`，**不给一份看起来
        能用的空规则表**。
      tags: [network]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 防火墙写路径的入口状态。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/FirewallConfigState'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/firewall:
    get:
      operationId: getFirewallState
      summary: 防火墙管理者、默认策略与规则（仅 admin）
      description: |
        CONTRACTS.md 第 14.1 节（P14.1 起）。只读：只跑 `ufw status verbose numbered`，
        不改规则、不 reload。

        `manager` 是判定结果，不是"装了什么"：ufw 与 firewalld 同时在场时判 `unknown`，
        因为两套规则同存时"我加了一条放行"在另一套的默认拒绝面前什么都不是。
        一种都没发现是 `none`，但**那不等于没有防火墙**——读不到时 `issues` 里有一条
        `ufw/missing`。

        `editable` 只在 manager=ufw 且 installed 时为 true；`reasons` 说明为什么不行。
        **没有写入口**：改规则是 `firewall.apply` 的预检 → 任务（P14.3）。
      tags: [network]
