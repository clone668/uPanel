  /api/v1/apps:
    get:
      operationId: getApps
      summary: 应用列表（登录可读）
      description: |
        CONTRACTS.md 第 8 节（P09.1 起）。返回应用元数据与摘要字段，按 name 升序稳定
        排序；同名应用按 id 兜底，翻页不会重复也不会漏。

        这一层只有元数据：`runtime_state`、`http_state`、`last_checked_at` 在没有探测器
        的时候是 `unknown` / `null`，不是猜出来的 `running`。`capabilities` 说的是“此刻
        真的能做到的事”，P09.1 里除 `open` 之外一律为 false——渲染成可点击的按钮再让它们
        全部失败，比不显示按钮更糟。

        `volume_dependencies` 没有依赖时是 `[]`；`group_id`、`public_url` 没有值时是 null。
      tags: [apps]
      security:
        - upanelSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: group_id
          in: query
          required: false
          description: |
            只返回该分组下的应用。形状对但分组不存在 → 200 + 空数组（“这个分组里没有应用”，
            与“分组被清空了”是同一件事，不报错）；形状不对（不是 `grp_` 加 32 位小写十六进制）
            → 400 `VALIDATION_ERROR`。被默默忽略的过滤器比报错更危险：调用方会以为自己在看
            某个分组，实际看的是全部——这与 §3“读不到不能变成没有”是同一条纪律。
          schema:
            type: string
            pattern: '^grp_[0-9a-f]{32}$'
      responses:
        '200':
          description: 当页应用。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AppListData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: postApp
      summary: 新建应用（仅 admin）
      description: |
        创建一条应用元数据。type 决定 binding 的唯一合法形状，多余字段一律 400——不会
        “猜你想要哪个”。

        同一个容器 / 单元 / 部署只能属于一个应用：重复绑定返回 422，不是 500。link 类型
        没有绑定对象，因此可以有多条。

        带 `volume_dependencies` 时，每个卷标识都要经代理确认存在：代理不可达返回 503
        （“暂时无法确认”，并且什么都不写），卷确实不存在返回 422 `DEPENDENCY_MISSING`。
        这两件事必须分开——前者等一会儿重试就好，后者要换一个卷。
      tags: [apps]
      security:
        - upanelSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppDefinitionRequest'
      responses:
        '201':
          description: 已创建。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/App'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 业务条件不允许（绑定已被占用、分组不存在、依赖卷不存在、参数越界）。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 代理不可用，依赖卷无法确认；本次没有任何写入。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/apps/discovery:
    get:
      operationId: getAppDiscovery
      summary: 本机候选列表（仅 admin）
      description: |
        CONTRACTS.md 第 8.2 节、STAGES.md 第 11 节（P09.2）。候选来自代理：监听中的
        端口、持有套接字的 systemd 单元、Docker 容器。这一层只回答“本机有什么”，不是
        应用记录——**确认候选就是 `POST /apps`**，没有第二个“确认”接口。

        权限 A：列表暴露本机所有监听端口与容器，是侦察材料，不给只读用户看。

        `candidates[].bound_app_id` 非空表示该目标已被某个应用登记（一个目标只能属于
        一个应用）。`missing_bindings` 列出“绑定对象已经不在了”的应用：容器重建后 ID
        会变，旧绑定在这里被点名要求重新确认——面板不会因为名字相同就自动接上去。

        来源全部失败时 `status=error`，部分失败是 `partial` 且各来源自带 `error`。
        代理不可用时整个接口是 503，而不是一份空候选列表：空列表会被读成“这台机器上
        没有任何服务”。
      tags: [apps]
      security:
        - upanelSession: []
      responses:
        '200':
          description: 候选列表与失效绑定。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id]
                properties:
                  data:
                    $ref: '#/components/schemas/AppDiscoveryData'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 代理不可用（或本部署没有发现读取端），读不到本机候选。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/apps/{id}:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      operationId: getApp
      summary: 单条应用（登录可读）
      description: |
        权限 V：DTO 里没有任何秘密（不含环境变量、不含 secret 引用值）。`favorite` 是
        当前登录用户自己的收藏状态，不是应用的公共属性。
      tags: [apps]
