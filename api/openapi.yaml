        CONTRACTS.md 第 8.3 节：0.1 只读。不创建、不删除卷，也不清理卷里的数据。

        in_use_by 由容器挂载归并而来，**不是** docker volume inspect 的结果：
        卷名是用户字符串，不放进命令行；mountpoint 是宿主路径，只用于解释
