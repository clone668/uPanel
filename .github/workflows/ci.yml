name: ci

# uPanel 持续集成：只运行仓库中真实存在的检查。
# 在 Ubuntu 24.04 runner 上跑 scripts/check.sh 全部门禁（Linux 专属测试因此
# 真正被执行，而不是只交叉编译）。
# 版本全部与 docs/DEPENDENCIES.md 一致，禁止在此处随手升级。

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: go + web + contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies from lockfile
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Run unified checks
        run: sh scripts/check.sh

      - name: Go race detector（并发修复涉及的包）
        # 全量 -race 会把 CI 拖到超时；这里覆盖本次审核修过并发语义的包。
        # 与 check.sh 的 go-test 同理：internal/files 的测试要求保留目录属主为 root，
        # runner 是普通用户，需要 sudo 提权跑。
        run: |
          TEST_GOCACHE=$(mktemp -d)
          sudo env "GOCACHE=$TEST_GOCACHE" "PATH=$PATH" go test -race -count=1 ./internal/auth ./internal/operations ./internal/files ./internal/notifications ./internal/metrics ./internal/agentstore ./internal/terminal ./internal/monitoring ./internal/accounts
          sudo rm -rf "$TEST_GOCACHE"
