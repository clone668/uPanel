# 由 uPanel 管理：站点 site_81ec3924082b54440f6692048de24d27
# 这个文件会被面板整份重写：在这里手工修改的内容，下一次应用就没了。
# 要改访问方式请改面板里的站点定义，不要在 Nginx 里改。

server {
    listen 80;
    listen [::]:80;
    server_name p102c.example.test;

    access_log /var/log/nginx/upanel-p102c.example.test.access.log;
    error_log  /var/log/nginx/upanel-p102c.example.test.error.log warn;

    client_max_body_size 1m;

    auth_basic "uPanel 受保护站点";
    auth_basic_user_file /etc/nginx/upanel-auth/site_81ec3924082b54440f6692048de24d27.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
